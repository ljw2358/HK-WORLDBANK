<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HK WORLD BANK</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; }
        #notice-display { font-size: 20px; color: #00ffcc; margin: 20px; }
        button { padding: 15px 30px; margin: 10px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>HK WORLD BANK</h1>
    <div id="notice-display">로딩 중...</div>
    
    <div>
        <button>송금</button><button>결제</button><button>예치</button><br>
        <button>보상</button><button>기본소득</button><button>스왑</button><br>
        <button>관련조회</button><button>DEX스왑</button><button>LP예치</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://hkwb-f46f0-default-rtdb.firebaseio.com" });
        const db = getDatabase(app);

        // 공지사항 연동
        onValue(ref(db, 'notice'), (snapshot) => {
            const noticeDisplay = document.getElementById('notice-display');
            if (noticeDisplay) noticeDisplay.innerText = snapshot.val() || "공지사항 없음";
        });

        // 9개 버튼 기능 연결
        window.onload = function() {
            const mapping = {
                "송금": () => alert("송금 기능"),
                "결제": () => alert("결제 기능"),
                "예치": () => alert("예치 기능"),
                "보상": () => alert("보상 기능"),
                "기본소득": () => alert("기본소득 기능"),
                "스왑": () => alert("스왑 기능"),
                "관련조회": () => alert("관련조회 기능"),
                "DEX스왑": () => alert("DEX스왑 기능"),
                "LP예치": () => alert("LP예치 기능")
            };

            document.querySelectorAll('button').forEach(btn => {
                const name = btn.innerText.trim();
                if (mapping[name]) btn.onclick = mapping[name];
            });
        };
    </script>
</body>
</html>
