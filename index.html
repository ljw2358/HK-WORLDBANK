<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK WORLDBANK</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121620;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .dashboard {
            width: 900px;
            background-color: #1a1f2c;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .welcome {
            background-color: #232938;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .welcome h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .welcome p {
            font-size: 13px;
            color: #a0aec0;
            line-height: 1.4;
        }
        .assets-container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .asset-card {
            flex: 1;
            background-color: #232938;
            padding: 20px;
            border-radius: 12px;
        }
        .asset-card .label {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 8px;
        }
        .asset-card .value {
            font-size: 24px;
            font-weight: bold;
        }
        .asset-card .value.krw {
            color: #f56565;
        }
        .actions-container {
            display: flex;
            gap: 20px;
        }
        .quick-actions {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .btn {
            padding: 15px;
            border-radius: 10px;
            border: none;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-green { background-color: #2f855a; }
        .btn-red { background-color: #9b2c2c; }
        .btn-purple { background-color: #6b46c1; }
        
        .sub-actions {
            flex: 1;
            background-color: #232938;
            padding: 15px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            align-content: center;
        }
        .sub-btn {
            background-color: #2a3447;
            border: none;
            color: #cbd5e0;
            padding: 12px 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- 월드뱅크 가운데 크게 배치 -->
        <div class="header">
            <h1>HK WORLDBANK</h1>
        </div>

        <div class="welcome">
            <h2>환영합니다, 혜공 형님</h2>
            <p>파이 네트워크 단일 경제권과 165종 컨트랙트 타임 시스템을 통해 일상부터 재래시장 결제까지 통합된 지상낙원을 생태계합니다.</p>
        </div>

        <!-- 자산 잔액 및 개인 자산 수량 -->
        <div class="assets-container">
            <div class="asset-card">
                <div class="label">자산 잔액</div>
                <div class="value krw">1,000,000.00 ₩</div>
            </div>
            <div class="asset-card">
                <div class="label">개인 자산 수량</div>
                <div class="value">150,000,000</div>
            </div>
        </div>

        <!-- 하단 기능 버튼 영역 -->
        <div class="actions-container">
            <div class="quick-actions">
                <button class="btn btn-green">예치하기</button>
                <button class="btn btn-green">송금/출금</button>
                <button class="btn btn-red">키스왑</button>
                <button class="btn btn-purple">UBI 재단</button>
            </div>
            <div class="sub-actions">
                <button class="sub-btn">네트워크설정</button>
                <button class="sub-btn">계정</button>
                <button class="sub-btn">보안</button>
                <button class="sub-btn">가스통계</button>
                <button class="sub-btn">지원</button>
                <button class="sub-btn">거래내역</button>
            </div>
        </div>
    </div>

</body>
</html>
