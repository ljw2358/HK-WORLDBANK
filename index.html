<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK 월드뱅크</title>
    <style>
        body { background-color: #0d131f; color: #ffffff; font-family: sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background-color: #1a2233; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #2d3a52; }
        .title { font-size: 1.1em; font-weight: bold; margin-bottom: 15px; }
        .value { font-size: 1.5em; font-weight: bold; color: #ffffff; margin: 10px 0; }
        .accent { color: #10b981; }
        .btn { background-color: #f9a825; color: #000; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; text-align: center; border: none; cursor: pointer; }
        .section-title { font-size: 1.2em; font-weight: bold; margin: 20px 0 10px; }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .menu-item { background-color: #1a2233; padding: 20px; border-radius: 10px; border: 1px solid #2d3a52; }
    </style>
</head>
<body>

<div class="container">
    <!-- 자산 대시보드 -->
    <div class="card">
        <div style="font-size: 0.9em; color: #aaa;">실시간 원장 관리</div>
        <div class="title">개인 보유 자산 및 실시간 누적 이자</div>
        <div>나의 개인 자산 보유 수량</div>
        <div class="value">0.000000 <span style="font-size: 0.6em; color: #888;">HK</span></div>
        <div>나의 실시간 누적 이자</div>
        <div class="value accent">0.000000 <span style="font-size: 0.6em; color: #888;">HK</span></div>
        <button class="btn">코어팀에게 메인넷 즉시 신청하기</button>
    </div>

    <div class="section-title">HK 월드뱅크 코어 지갑 시스템</div>

    <!-- 메뉴 리스트 -->
    <div class="menu-grid">
        <div class="menu-item">지갑연결 <br><small style="color:#888;">인증 기관 선택망</small></div>
        <div class="menu-item">송금 <br><small style="color:#888;">수취인 주소 추적망</small></div>
        <div class="menu-item">결제 <br><small style="color:#888;">가맹점 상거래 연동망</small></div>
        <div class="menu-item">예치 <br><small style="color:#888;">신탁 자산 락업 설정</small></div>
        <div class="menu-item">기본소득 <br><small style="color:#888;">복지 계정 다이렉트망</small></div>
        <div class="menu-item">스왑 <br><small style="color:#888;">실시간 이종 자산 가치망</small></div>
        <div class="menu-item">DEX스왑 <br><small style="color:#888;">탈중앙 가스 피 제어망</small></div>
        <div class="menu-item">LP스테이킹 <br><small style="color:#888;">유동성 공급 풀 정산망</small></div>
    </div>
</div>

</body>
</html>
