<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>홍콩 세계은행</title>
    <style>
        :root { --hk-gold: #FFD700; --hk-bg: #050505; --hk-card: #1a1a1a; }
        body { background-color: var(--hk-bg); color: #fff; font-family: sans-serif; padding: 20px; }
        .wrapper { display: flex; gap: 20px; justify-content: center; max-width: 1000px; margin: 0 auto; flex-wrap: wrap; }
        .column { flex: 1; min-width: 450px; max-width: 480px; }
        .card { background: var(--hk-card); padding: 25px; border-radius: 20px; border: 1px solid #333; margin-bottom: 20px; min-height: 150px; }
        h1 { text-align: center; color: var(--hk-gold); margin-bottom: 30px; }
        #chatModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; background: #1a1a1a; padding: 25px; border-radius: 20px; border: 2px solid var(--hk-gold); z-index: 1000; }
    </style>
    <!-- 50개국어 번역 스크립트 -->
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'ko', includedLanguages: 'ko,en,zh-CN,zh-TW,ja,es,fr,de,ru,ar,pt,it,vi,th,id,hi,tr,pl,nl,sv,fi,no,da,cs,hu,ro,el,he,fa,uk,ms,bn,mr,ta,te,gu,kn,ml,pa,ur,af,sw,zu,xh,am,yo,ig,ha,km,lo'}, 'google_translate_element');
        }
    </script>
</head>
<body>
    <h1>홍콩 세계은행</h1>
    <div id="google_translate_element" style="text-align: center; margin-bottom: 20px;"></div>
    
    <div class="wrapper">
        <div class="column">
            <div class="card">
                <h2>지갑 연결</h2>
                <button onclick="connectWallet()" style="background: var(--hk-gold); border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer;">연결</button>
                <p id="walletAddress" style="margin-top: 10px;"></p>
            </div>
            <div class="card">
                <h3>Social Media</h3>
                <p>YouTube: @Hyekong2025</p>
                <p>TikTok: @Hyekong2025</p>
            </div>
        </div>
        <div class="column">
            <div class="card">
                <h3>💎 Asset & Profile</h3>
                <p id="userAccount">지갑을 연결해주세요.</p>
            </div>
            <div class="card">
                <h3>🚀 Industry Status</h3>
                <p>로봇 자동화: 98% | 우주 탐사: 72% | 핵융합 개발: 85%</p>
            </div>
        </div>
    </div>

    <!-- AGI 챗봇 -->
    <div style="position: fixed; bottom: 30px; right: 30px; font-size: 50px; cursor: pointer;" onclick="toggleChat()">🤖</div>
    <div id="chatModal">
        <h3 style="color: var(--hk-gold);">HK AGI 비서 삐니</h3>
        <p>홍콩 세계은행에 오신 것을 환영합니다. 무엇을 도와드릴까요?</p>
        <button onclick="toggleChat()" style="background: var(--hk-gold); border: none; padding: 10px; width: 100%; border-radius: 10px; cursor: pointer;">닫기</button>
    </div>

    <script>
        function toggleChat() {
            const m = document.getElementById('chatModal');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }
        async function connectWallet() {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            document.getElementById('walletAddress').innerText = "연결 완료";
            document.getElementById('userAccount').innerText = "계정: " + accounts[0];
        }
    </script>
</body>
</html>
