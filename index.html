<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --hk-gold: #FFD700; --hk-bg: #050505; --hk-card: #1a1a1a; }
        body { background-color: var(--hk-bg); color: #fff; font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; text-align: center; }
        .header { margin-bottom: 40px; }
        .header h1 { color: var(--hk-gold); font-size: 2.5em; margin-bottom: 10px; }
        .card { background: var(--hk-card); padding: 30px; border-radius: 20px; border: 1px solid #333; margin-bottom: 20px; }
        button { background: var(--hk-gold); color: #000; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1.1em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>HK Worldbank</h1>
            <p>미래 산업 플랫폼과 함께하는 인류의 도약</p>
        </div>
        <div class="card">
            <h2>지갑 연결</h2>
            <button id="connectButton" onclick="connectWallet()">지갑 연결하기</button>
            <p id="walletAddress" style="margin-top: 15px; color: var(--hk-gold);"></p>
        </div>
        <div class="card">
            <h3>HK 사회 재단</h3>
            <p>수익의 30%를 전 세계 취약계층과 공유합니다.</p>
        </div>
    </div>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
    <script>
        async function connectWallet() {
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                document.getElementById('walletAddress').innerText = "연결된 주소: " + accounts[0].substring(0, 10) + "...";
            } else { alert("메타마스크를 설치해주세요!"); }
        }
    </script>
</body>
</html>
