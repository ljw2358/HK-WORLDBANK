<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK WorldBank Platform - Vision 2030</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .hk-font-big { font-size: 3.5rem; font-weight: 900; }
        .module-card { background: #1e293b; border: 1px solid #334155; transition: 0.3s; }
        .module-card:hover { border-color: #f59e0b; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

    <header class="p-12 border-b border-slate-800">
        <div class="flex justify-between items-center">
            <h1 class="hk-font-big text-amber-500 tracking-tighter" id="main-title">HK 월드뱅크 플랫폼</h1>
            <select id="lang-select" onchange="translatePage(this.value)" class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                <option value="ko">🇰🇷 한국어</option>
                <option value="en">🇺🇸 English</option>
                <option value="vi">🇻🇳 Tiếng Việt</option>
                <option value="ja">🇯🇵 日本語</option>
            </select>
        </div>
    </header>

    <main class="p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-slate-900 p-8 rounded-3xl border border-amber-500/30">
                <h2 class="text-3xl font-black text-amber-500 mb-6">HK 비전 2030</h2>
                <ul class="space-y-4 text-lg">
                    <li><i class="fa-solid fa-house mr-3 text-amber-400"></i>주거 복지</li>
                    <li><i class="fa-solid fa-heart-pulse mr-3 text-amber-400"></i>의료 혁신</li>
                    <li><i class="fa-solid fa-graduation-cap mr-3 text-amber-400"></i>학비 지원</li>
                    <li><i class="fa-solid fa-robot mr-3 text-amber-400"></i>1가구 1로봇</li>
                </ul>
            </div>
            <div class="bg-slate-900 p-8 rounded-3xl border border-blue-500/30 text-center">
                <h2 class="text-3xl font-black text-blue-400">영생 (Eternal Life)</h2>
                <p class="mt-4 text-slate-400">HK가 실현할 인류의 미래</p>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <h2 class="text-2xl font-bold">국내 분산 연동망</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="module-card p-6 rounded-2xl">
                    <h3 class="text-xl font-bold mb-4 text-amber-500">예치 시스템</h3>
                    <div class="space-y-3">
                        <input type="number" placeholder="수량 (HK)" class="w-full bg-slate-950 p-3 rounded-lg border border-slate-700">
                        <select class="w-full bg-slate-950 p-3 rounded-lg border border-slate-700">
                            <option>1개월</option><option>6개월</option><option>12개월</option>
                        </select>
                        <div class="text-sm text-slate-400">예상 수익률: 8.5%</div>
                        <input type="password" maxlength="6" placeholder="6자리 승인 암호" class="w-full bg-slate-950 p-3 rounded-lg border border-slate-700 text-center tracking-[0.5em]">
                        <button class="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-lg">원장 승인 및 실행</button>
                    </div>
                </div>
                </div>
        </div>

        <div class="lg:col-span-1 space-y-6">
            <div class="bg-slate-900 p-8 rounded-3xl">
                <h3 class="font-bold text-xl mb-6">공식 채널</h3>
                <div class="space-y-4">
                    <a href="https://www.youtube.com/@Hyekong2025" class="block bg-red-600 p-4 rounded-xl text-center font-bold">YouTube</a>
                    <a href="https://www.tiktok.com/@hyekong2025" class="block bg-black border border-slate-700 p-4 rounded-xl text-center font-bold">TikTok</a>
                </div>
            </div>
            <div id="chat-box" class="h-64 bg-slate-900 p-6 rounded-3xl overflow-y-auto text-sm border border-slate-700">
                <p class="text-amber-500">혜공 형님, HK 지능형 추론 엔진이 작동 중입니다.</p>
            </div>
        </div>
    </main>

    <script>
        function translatePage(lang) {
            const data = {
                ko: { title: "HK 월드뱅크 플랫폼" },
                en: { title: "HK WorldBank Platform" },
                vi: { title: "Nền tảng HK WorldBank" },
                ja: { title: "HKワールドバンクプラットフォーム" }
            };
            document.getElementById('main-title').innerText = data[lang].title;
        }
    </script>
</body>
</html>
