<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HK WORLD BANK - SUPREME 17</title>
</head>
<body>
 <script>
    const HK_DataEngine = {
        // 1. 잔액 조회 (Stellar Horizon API 연동)
        init: async () => {
            const address = "GBDZQSKO6I5VH5KUUEXQAQWPBHPEJVISH4N2K2AQERDKQYMPRKLNSVFQ";
            try {
                const response = await fetch(`https://horizon.stellar.org/accounts/${address}`);
                const account = await response.json();
                const balance = account.balances.find(b => b.asset_type === 'native').balance;
                document.getElementById("m1").innerText = `저수지 잔액: ${balance} XLM`;
                console.log("잔액 조회 성공:", balance);
            } catch (e) {
                console.error("잔액 조회 실패:", e);
            }
        },

        // 2. 버튼 클릭 시 트랜잭션 연동 예시
        startEngine: () => {
            alert("🚀 엔진 가동! 스텔라 트랜잭션을 준비합니다.");
            // 여기서 스텔라 트랜잭션 로직을 연결할 예정입니다.
        }
    };

    window.onload = HK_DataEngine.init;
</script>

<button onclick="HK_DataEngine.startEngine()">🚀 엔진 가동</button>
 
</html>
