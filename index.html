\<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK WORLDBANK</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a2e; color: white; margin: 0; padding: 20px; text-align: center; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .menu-icon { font-size: 24px; cursor: pointer; }
        .title { font-size: 20px; font-weight: bold; flex-grow: 1; text-align: center; }
        .asset-box { background: #2b2b4d; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .asset-value { font-size: 24px; font-weight: bold; margin-top: 10px; }
        .asset-coin { margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 5px; font-size: 16px; }
        .pi-logo { width: 18px; height: 18px; vertical-align: middle; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .box { background: #4a4a7d; padding: 15px; border-radius: 10px; display: flex; justify-content: center; align-items: center; text-align: center; }
        .future-projects { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        .project { background: #3b3b6d; padding: 10px 15px; border-radius: 5px; cursor: pointer; display: flex; justify-content: center; align-items: center; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <div class="menu-icon">☰</div>
        <div class="title">HK WORLDBANK</div>
        <div style="width: 24px;"></div>
    </div>

    <div class="asset-box">
        <div>자산 잔액</div>
        <div class="asset-value">1,000,000.00 ₩</div>
        <div class="asset-coin">
            <span>자산 코인 수량: 1,000,000</span>
            <!-- 파이 네트워크 공식 심볼 SVG 로고 삽입 -->
            <svg class="pi-logo" viewBox="0 0 32 32" fill="#FFFFFF">
                <path d="M16 0C7.163 0 0 7.163 0 16s7.163 16 16 16 16-7.163 16-16S24.837 0 16 0zm5.2 21.6h-3.2v-6.4h-3.2v6.4H11.6V10.4h2.4v4.8h3.2v-4.8h4v11.2z"/>
            </svg>
        </div>
    </div>

    <div class="grid-container">
        <div class="box">AGI Pi 상태</div>
        <div class="box">60개국 실시간 동기화</div>
    </div>

    <div class="future-projects">
        <div class="project">로봇</div>
        <div class="project">안경폰</div>
        <div class="project">UAM</div>
        <div class="project">핵융합</div>
        <div class="project">퀀텀 바이오</div>
        <div class="project">우주 시스템</div>
        <div class="project">165층 타워</div>
    </div>
</body>
</html>
