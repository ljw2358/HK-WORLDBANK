<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK WorldBank - 60 Nations Global Enterprise Core v7.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #030712; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-panel { background: rgba(11, 15, 25, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); }
        .custom-select { appearance: none; background: #111827 url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%239ca3af'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7'/%3E%3C/svg%3E") no-repeat right 0.75rem center/1rem 1rem; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body x-data="hkwb60App()" class="min-h-screen pb-24 selection:bg-amber-500 selection:text-black">

    <!-- TOP HEADER -->
    <header class="sticky top-0 z-50 bg-[#030712]/95 backdrop-blur-md border-b border-gray-800 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500 text-black font-black px-3.5 py-1.5 rounded-xl text-base shadow-lg shadow-amber-500/20">HK</div>
            <div>
                <h1 class="font-extrabold text-sm tracking-tight text-white" x-text="t('brand_title')">HK WorldBank</h1>
                <p class="text-[10px] text-amber-400 font-mono tracking-wider" x-text="t('brand_subtitle')">WEB3 DIGITAL BANKING</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <span class="hidden md:inline-block text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20" x-text="t('node_status')">60 NATIONS MULTILINGUAL NODE</span>
            
            <!-- 60개국 언어 셀렉트 박스 -->
            <select x-model="lang" @change="changeLang($event.target.value)" class="custom-select bg-gray-900 border border-gray-700 text-xs text-gray-200 font-semibold py-2 pl-3 pr-8 rounded-xl focus:outline-none focus:border-amber-500 max-w-[210px]">
                <option value="ko">🇰🇷 한국어 (Korean)</option>
                <option value="en">🇬🇧 English (Global)</option>
                <option value="zh">🇨🇳 中文 (Chinese)</option>
                <option value="ja">🇯🇵 日本語 (Japanese)</option>
                <option value="es">🇪🇸 Español (Spanish)</option>
                <option value="fr">🇫🇷 Français (French)</option>
                <option value="de">🇩🇪 Deutsch (German)</option>
                <option value="ru">🇷🇺 Русский (Russian)</option>
                <option value="pt">🇵🇹 Português (Portuguese)</option>
                <option value="it">🇮🇹 Italiano (Italian)</option>
                <option value="vi">🇻🇳 Tiếng Việt (Vietnamese)</option>
                <option value="th">🇹🇭 ไทย (Thai)</option>
                <option value="id">🇮🇩 Bahasa Indonesia (Indonesian)</option>
                <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
                <option value="ar">🇸🇦 العربية (Arabic)</option>
                <option value="tr">🇹🇷 Türkçe (Turkish)</option>
                <option value="nl">🇳🇱 Nederlands (Dutch)</option>
                <option value="pl">🇵🇱 Polski (Polish)</option>
                <option value="sv">🇸🇻 Svenska (Swedish)</option>
                <option value="uk">🇺🇦 Українська (Ukrainian)</option>
                <option value="ms">🇲🇾 Bahasa Melayu (Malay)</option>
                <option value="fil">🇵🇭 Tagalog (Filipino)</option>
                <option value="el">🇬🇷 Ελληνικά (Greek)</option>
                <option value="cs">🇨🇿 Čeština (Czech)</option>
                <option value="hu">🇭🇺 Magyar (Hungarian)</option>
                <option value="ro">🇷🇴 Română (Romanian)</option>
                <option value="da">🇩🇰 Dansk (Danish)</option>
                <option value="fi">🇫🇮 Suomi (Finnish)</option>
                <option value="no">🇳🇴 Norsk (Norwegian)</option>
                <option value="fa">🇮🇷 فارسی (Persian)</option>
                <option value="he">🇮🇱 עברית (Hebrew)</option>
                <option value="bn">🇧🇩 বাংলা (Bengali)</option>
                <option value="ur">🇵🇰 اردو (Urdu)</option>
                <option value="sw">🇰🇪 Kiswahili (Swahili)</option>
                <option value="ta">🇮🇳 தமிழ் (Tamil)</option>
                <option value="te">🇮🇳 తెలుగు (Telugu)</option>
                <option value="mr">🇮🇳 मराठी (Marathi)</option>
                <option value="gu">🇮🇳 ગુજરાતી (Gujarati)</option>
                <option value="kn">🇮🇳 ಕನ್ನಡ (Kannada)</option>
                <option value="ml">🇮🇳 മലയാളം (Malayalam)</option>
                <option value="pa">🇵🇰 ਪੰਜਾਬੀ (Punjabi)</option>
                <option value="si">🇱🇰 සිංහල (Sinhala)</option>
                <option value="my">🇲🇲 ဗမာစာ (Burmese)</option>
                <option value="km">🇰🇭 ខ្មែរ (Khmer)</option>
                <option value="lo">🇱🇴 ພາສາລາວ (Lao)</option>
                <option value="ka">🇬🇪 ქართული (Georgian)</option>
                <option value="am">🇪🇹 አማርኛ (Amharic)</option>
                <option value="yo">🇳🇬 Yorùbá (Yoruba)</option>
                <option value="ig">🇳🇬 Igbo (Igbo)</option>
                <option value="ha">🇳🇬 Hausa (Hausa)</option>
                <option value="zu">🇿🇦 IsiZulu (Zulu)</option>
                <option value="xh">🇿🇦 IsiXhosa (Xhosa)</option>
                <option value="af">🇿🇦 Afrikaans (Afrikaans)</option>
                <option value="sq">🇦🇱 Shqip (Albanian)</option>
                <option value="hy">🇦🇲 Հայերեն (Armenian)</option>
                <option value="az">🇦🇿 Azərbaycan (Azerbaijani)</option>
                <option value="eu">🇪🇺 Euskara (Basque)</option>
                <option value="be">🇧🇾 Беларуская (Belarusian)</option>
                <option value="bs">🇧🇦 Bosanski (Bosnian)</option>
                <option value="bg">🇧🇬 Български (Bulgarian)</option>
            </select>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">

        <!-- SUB NAVIGATION TABS -->
        <div class="flex space-x-2 overflow-x-auto scrollbar-hide pb-2">
            <button @click="currentTab = 'dashboard'" :class="currentTab === 'dashboard' ? 'bg-amber-500 text-black font-extrabold' : 'bg-gray-900 text-gray-400 border border-gray-800'" class="px-4 py-2.5 rounded-xl text-xs whitespace-nowrap transition" x-text="t('tab_dash')">대시보드</button>
            <button @click="currentTab = 'staking'" :class="currentTab === 'staking' ? 'bg-amber-500 text-black font-extrabold' : 'bg-gray-900 text-gray-400 border border-gray-800'" class="px-4 py-2.5 rounded-xl text-xs whitespace-nowrap transition" x-text="t('tab_stake')">스테이킹 (APY 31.41%)</button>
            <button @click="currentTab = 'transfer'" :class="currentTab === 'transfer' ? 'bg-amber-500 text-black font-extrabold' : 'bg-gray-900 text-gray-400 border border-gray-800'" class="px-4 py-2.5 rounded-xl text-xs whitespace-nowrap transition" x-text="t('tab_transfer')">초고속 송금</button>
            <button @click="currentTab = 'cluster'" :class="currentTab === 'cluster' ? 'bg-amber-500 text-black font-extrabold' : 'bg-gray-900 text-gray-400 border border-gray-800'" class="px-4 py-2.5 rounded-xl text-xs whitespace-nowrap transition" x-text="t('tab_cluster')">울산·경주·포항 인프라</button>
            <button @click="currentTab = 'governance'" :class="currentTab === 'governance' ? 'bg-amber-500 text-black font-extrabold' : 'bg-gray-900 text-gray-400 border border-gray-800'" class="px-4 py-2.5 rounded-xl text-xs whitespace-nowrap transition" x-text="t('tab_gov')">거버넌스 및 UBI</button>
        </div>

        <!-- TAB 1: DASHBOARD -->
        <template x-if="currentTab === 'dashboard'">
            <div class="space-y-6">
                <section class="glass-panel rounded-3xl p-6 relative shadow-2xl border-amber-500/20">
                    <div class="flex justify-between items-center mb-5">
                        <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs font-bold px-3 py-1 rounded-lg" x-text="t('ledger_badge')">실시간 원장 데이터</span>
                        <span class="text-xs font-bold text-amber-400" x-text="t('status_pending')">코어팀 승인 대기 중</span>
                    </div>
                    
                    <h2 class="text-xl font-black text-white mb-5" x-text="t('dashboard_title')">개인 자산 대시보드</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl">
                            <span class="text-xs text-gray-400 block mb-1 font-medium" x-text="t('holding_label')">개인 보유 수량</span>
                            <div class="text-3xl font-black text-white tracking-tight flex items-baseline justify-between">
                                <span x-text="balance">1,000,000.00</span>
                                <span class="text-sm font-bold text-amber-500">HK</span>
                            </div>
                        </div>
                        
                        <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl">
                            <span class="text-xs text-gray-400 block mb-1 font-medium" x-text="t('interest_label')">실시간 누적 이자</span>
                            <div class="text-3xl font-black text-emerald-400 tracking-tight flex items-baseline justify-between">
                                <span x-text="earnedInterest">31,410.00</span>
                                <span class="text-sm font-bold text-emerald-500">HK (31.41%)</span>
                            </div>
                        </div>
                    </div>

                    <button @click="triggerMainnetAlert()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-extrabold text-sm py-4 rounded-2xl shadow-xl shadow-amber-500/20 transition">
                        <span x-text="t('btn_mainnet')">코어팀에게 메인넷 즉시 신청하기</span>
                    </button>
                </section>

                <section class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div class="glass-panel p-4 rounded-2xl text-center">
                        <i class="fa-solid fa-wallet text-amber-400 text-2xl mb-2"></i>
                        <h4 class="text-xs font-bold text-white mb-1" x-text="t('grid_wallet')">지갑연결</h4>
                        <p class="text-[10px] text-gray-400">Pi SDK v2.0 Sync</p>
                    </div>
                    <div class="glass-panel p-4 rounded-2xl text-center">
                        <i class="fa-solid fa-paper-plane text-blue-400 text-2xl mb-2"></i>
                        <h4 class="text-xs font-bold text-white mb-1" x-text="t('grid_transfer')">초고속 송금</h4>
                        <p class="text-[10px] text-gray-400">Instant Settlement</p>
                    </div>
                    <div class="glass-panel p-4 rounded-2xl text-center">
                        <i class="fa-solid fa-robot text-purple-400 text-2xl mb-2"></i>
                        <h4 class="text-xs font-bold text-white mb-1" x-text="t('grid_robotics')">로보틱스 인프라</h4>
                        <p class="text-[10px] text-gray-400">Ulsan Mega Cluster</p>
                    </div>
                    <div class="glass-panel p-4 rounded-2xl text-center">
                        <i class="fa-solid fa-atom text-emerald-400 text-2xl mb-2"></i>
                        <h4 class="text-xs font-bold text-white mb-1" x-text="t('grid_fusion')">핵융합·우주망</h4>
                        <p class="text-[10px] text-gray-400">Pohang Advanced R&D</p>
                    </div>
                </section>
            </div>
        </template>

        <!-- TAB 2: STAKING -->
        <template x-if="currentTab === 'staking'">
            <div class="glass-panel rounded-3xl p-6 space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-black text-white" x-text="t('stake_title')">3년 정기 자산 예치 및 스테이킹</h2>
                    <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-3 py-1 rounded-lg">APY 31.41% FIXED</span>
                </div>
                <p class="text-xs text-gray-400 leading-relaxed" x-text="t('stake_desc')">HK WorldBank의 스마트컨트랙트를 통해 안전하게 자산을 예치하고 확정 수익률을 실시간으로 수령하십시오.</p>
                
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl space-y-4">
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-400" x-text="t('stake_avail')">예치 가능 잔액</span>
                        <span class="text-white font-bold">1,000,000.00 HK</span>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-2 font-medium" x-text="t('stake_input')">예치 수량 입력</label>
                        <div class="relative">
                            <input type="number" x-model="stakeAmount" class="w-full bg-black border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 font-mono">
                            <span class="absolute right-4 top-3 text-amber-500 font-bold text-xs">HK</span>
                        </div>
                    </div>
                    <div class="pt-2 border-t border-gray-800 flex justify-between items-center">
                        <span class="text-xs text-gray-400" x-text="t('stake_expected')">3년 후 예상 총 수령액</span>
                        <span class="text-emerald-400 font-black text-lg" x-text="(stakeAmount * 1.9423).toFixed(2) + ' HK'"></span>
                    </div>
                </div>

                <button @click="alert(t('stake_success'))" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-sm py-4 rounded-2xl transition shadow-lg shadow-amber-500/20" x-text="t('stake_btn')">
                    스테이킹 즉시 실행
                </button>
            </div>
        </template>

        <!-- TAB 3: TRANSFER -->
        <template x-if="currentTab === 'transfer'">
            <div class="glass-panel rounded-3xl p-6 space-y-6">
                <h2 class="text-xl font-black text-white" x-text="t('trans_title')">초고속 디지털 자산 송금</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-2 font-medium" x-text="t('trans_to')">수신자 지갑 주소 또는 UID</label>
                        <input type="text" placeholder="HK-WALLET-XXXX-YYYY" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 font-mono">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-2 font-medium" x-text="t('trans_amount')">송금 수량</label>
                        <div class="relative">
                            <input type="number" placeholder="0.00" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 font-mono">
                            <span class="absolute right-4 top-3 text-amber-500 font-bold text-xs">HK</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-2 font-medium" x-text="t('trans_memo')">메모 (선택사항)</label>
                        <input type="text" placeholder="비즈니스 정산 및 자금 이체" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500">
                    </div>
                </div>
                <button @click="alert(t('trans_success'))" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm py-4 rounded-2xl transition shadow-lg shadow-blue-600/20" x-text="t('trans_btn')">
                    안전 송금 실행
                </button>
            </div>
        </template>

        <!-- TAB 4: CLUSTER -->
        <template x-if="currentTab === 'cluster'">
            <div class="space-y-6">
                <div class="glass-panel rounded-3xl p-6 space-y-4">
                    <h2 class="text-xl font-black text-white" x-text="t('cluster_title')">동남권 메가 클러스터 마스터플랜</h2>
                    <p class="text-xs text-gray-400 leading-relaxed" x-text="t('cluster_desc')">울산(로보틱스), 경주(퀀텀 바이오 및 165층 파이낸스 타워), 포항(핵융합 및 항공우주)을 잇는 미래 기술 핵심 벨트입니다.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="glass-panel p-5 rounded-2xl space-y-2 border-amber-500/30">
                        <div class="text-amber-400 font-bold text-sm" x-text="t('c_ulsan')">울산시 (Ulsan)</div>
                        <div class="text-xs text-white font-semibold" x-text="t('c_ulsan_sub')">로보틱스 및 제조 자동화 R&D</div>
                        <p class="text-[11px] text-gray-400" x-text="t('c_ulsan_desc')">지능형 로봇 제조 팩토리 및 스마트 물류 인프라 전진기지 구축.</p>
                    </div>
                    <div class="glass-panel p-5 rounded-2xl space-y-2 border-emerald-500/30">
                        <div class="text-emerald-400 font-bold text-sm" x-text="t('c_gyeongju')">경주시 (Gyeongju)</div>
                        <div class="text-xs text-white font-semibold" x-text="t('c_gyeongju_sub')">165층 본사 타워 & 퀀텀 바이오</div>
                        <p class="text-[11px] text-gray-400" x-text="t('c_gyeongju_desc')">초고층 파이낸셜 헤드쿼터 및 미래 생명공학 연구 클러스터 조성.</p>
                    </div>
                    <div class="glass-panel p-5 rounded-2xl space-y-2 border-blue-500/30">
                        <div class="text-blue-400 font-bold text-sm" x-text="t('c_pohang')">포항시 (Pohang)</div>
                        <div class="text-xs text-white font-semibold" x-text="t('c_pohang_sub')">핵융합 에너지 및 항공우주 시스템</div>
                        <p class="text-[11px] text-gray-400" x-text="t('c_pohang_desc')">차세대 청정에너지 발전 연구 및 우주 항공 네트워킹 허브.</p>
                    </div>
                </div>
            </div>
        </template>

        <!-- TAB 5: GOVERNANCE -->
        <template x-if="currentTab === 'governance'">
            <div class="glass-panel rounded-3xl p-6 space-y-6">
                <h2 class="text-xl font-black text-white" x-text="t('gov_title')">글로벌 상생 금융 및 UBI 모델</h2>
                <p class="text-xs text-gray-400 leading-relaxed" x-text="t('gov_desc')">HK WorldBank는 순이익의 30%를 글로벌 빈곤 지역 및 소외계층을 위한 디지털 기본소득(UBI) 재원으로 투명하게 환원합니다.</p>
                
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl space-y-3">
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-400" x-text="t('gov_rate')">UBI 누적 기금 적립률</span>
                        <span class="text-amber-400 font-bold">30.0% (Net Profit)</span>
                    </div>
                    <div class="w-full bg-gray-800 h-2.5 rounded-full overflow-hidden">
                        <div class="bg-amber-500 h-full w-[30%]"></div>
                    </div>
                    <p class="text-[11px] text-gray-400 pt-1" x-text="t('gov_sub')">스마트컨트랙트를 통해 자동으로 공정하게 분배되며 사회적 인프라 확충에 기여합니다.</p>
                </div>

                <div class="border-t border-gray-800 pt-4 flex justify-between items-center text-xs text-gray-400">
                    <span x-text="t('chairman_label')">Chairman: 혜공 형님</span>
                    <span class="font-mono text-amber-500">HK GROUP © 2026</span>
                </div>
            </div>
        </template>

    </main>

    <!-- SYSTEM SCRIPT CONTROLLER (60 Languages Full Enterprise Engine) -->
    <script>
        function hkwb60App() {
            return {
                lang: 'ko',
                currentTab: 'dashboard',
                balance: '1,000,000.00',
                earnedInterest: '31,410.00',
                stakeAmount: 100000,
                dict: {
                    ko: {
