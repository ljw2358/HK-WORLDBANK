<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --hk-gold: #FFD700; --hk-bg: #050505; --hk-card: #1a1a1a; }
        body { background-color: var(--hk-bg); color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 50px 20px; }
        .container { width: 100%; max-width: 600px; text-align: center; }
        .header { margin-bottom: 50px; }
        .header h1 { color: var(--hk-gold); font-size: 3em; margin-bottom: 10px; }
        .card { background: var(--hk-card); padding: 40px; border-radius: 20px; border: 1px solid #333; margin-bottom: 20px; }
        button { background: var(--hk-gold); color: #000; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1.1em; transition: 0.3s; }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>HK Worldbank</h1>
            <p>인류의 미래를 설계하는 국가급 산업 플랫폼</p>
        </div>
        <div class="card">
            <h2>지갑 연결 상태</h2>
            <button id="connectButton" onclick="connectWallet()">지갑 연결</button>
            <p id="walletAddress" style="margin-top: 20px; color: var(--hk-gold);"></p>
        </div>
        <div class="card">
            <h3>HK 사회 재단</h3>
            <p>수익의 30%를 글로벌 사회를 위해 환원합니다.</p>
        </div>
    </div>
<!-- 개인 자산 현황 카드 -->
<div class="card">
    <h3>💎 내 자산 및 프로필</h3>
    <p id="userAccount" style="color: var(--hk-gold);">지갑을 연결하면 주소가 표시됩니다.</p>
    <p>보유 HK 포인트: 1,250,000 P</p>
</div>

<!-- AGI 챗봇 아이콘 (우측 하단) -->
<div style="position: fixed; bottom: 20px; right: 20px; font-size: 40px; cursor: pointer; z-index: 9999;" onclick="alert('AGI 고객센터: 무엇을 도와드릴까요?')">🤖</div>

    <!-- 개인 자산 현황 카드 -->
<div class="card">
    <h3>💎 내 자산 및 프로필</h3>
    <div style="margin-top: 15px; padding: 15px; background: #000; border-radius: 10px; border: 1px solid var(--hk-gold);">
        <p style="font-size: 0.9em; margin-bottom: 5px;">현재 연결된 계정</p>
        <div id="userAccount" style="font-size: 1.1em; color: var(--hk-gold); word-break: break-all;">지갑을 연결해주세요.</div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 20px;">
        <p>HK 포인트</p>
        <p style="color: var(--hk-gold); font-weight: bold;">1,250,000 P</p>
    </div>
</div>

<script>
    // 기존 connectWallet 함수를 조금 수정해서 자산 카드에도 주소를 띄워줍니다.
    async function connectWallet() {
        if (window.ethereum) {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            const addr = accounts[0];
            document.getElementById('walletAddress').innerText = "연결 완료: " + addr.substring(0, 10) + "...";
            document.getElementById('userAccount').innerText = addr;
            document.getElementById('connectButton').innerText = "연결됨";
        } else { alert("메타마스크를 설치해주세요!"); }
    }
</script>

    <!-- 산업 데이터 대시보드 섹션 -->
    <div class="card">
        <h3>🚀 실시간 산업 현황</h3>
        <div style="display: flex; justify-content: space-around; margin-top: 20px;">
            <div style="text-align: center;">
                <div style="font-size: 1.5em; color: var(--hk-gold);">98%</div>
                <div style="font-size: 0.8em;">로봇 자동화</div>
            </div>
            <div style="text-align: center;">
                <div style="font-size: 1.5em; color: var(--hk-gold);">72%</div>
                <div style="font-size: 0.8em;">우주 탐사</div>
            </div>
            <div style="text-align: center;">
                <div style="font-size: 1.5em; color: var(--hk-gold);">85%</div>
                <div style="font-size: 0.8em;">핵융합 개발</div>
            </div>
        </div>
    </div>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
    <script>
        async function connectWallet() {
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                document.getElementById('walletAddress').innerText = "주소: " + accounts[0].substring(0, 10) + "...";
            } else { alert("메타마스크를 설치해주세요!"); }
        }
    </script>
<!-- AGI 챗봇 아이콘 -->
<div id="agiChatbot" style="position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: var(--hk-gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000;" onclick="alert('AGI 고객센터 연결 중: 형님의 플랫폼에 오신 것을 환영합니다!')">
    <span style="font-size: 24px;">🤖</span>
</div>

</body>
</html>
