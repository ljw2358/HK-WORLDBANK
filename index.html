<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --hk-gold: #FFD700; --hk-bg: #050505; --hk-card: #1a1a1a; }
        body { background-color: var(--hk-bg); color: #fff; font-family: sans-serif; padding: 20px; }
        .wrapper { display: flex; gap: 20px; justify-content: center; max-width: 1000px; margin: 0 auto; flex-wrap: wrap; }
        .column { flex: 1; min-width: 450px; max-width: 480px; }
        .card { background: var(--hk-card); padding: 25px; border-radius: 20px; border: 1px solid #333; margin-bottom: 20px; min-height: 120px; }
        
        /* 제목을 훨씬 더 크게 */
        h1 { text-align: center; color: var(--hk-gold); font-size: 60px; margin: 40px 0; }
        
        /* 챗봇 상담창 */
        #chatModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; background: #1a1a1a; padding: 25px; border-radius: 20px; border: 2px solid var(--hk-gold); z-index: 1000; }
    </style>
</head>
<body>
    <h1>HK WorldBank</h1>
    
    <div class="wrapper">
        <div class="column">
            <!-- 유튜브와 틱톡 각각 네모칸 -->
            <div class="card">
                <h3>YouTube</h3>
                <a href="https://www.youtube.com/@Hyekong2025" target="_blank" style="color: var(--hk-gold);">@Hyekong2025</a>
            </div>
            <div class="card">
                <h3>TikTok</h3>
                <a href="https://www.tiktok.com/@Hyekong2025" target="_blank" style="color: var(--hk-gold);">@Hyekong2025</a>
            </div>
        </div>
        <div class="column">
            <div class="card">
                <h3>💎 Asset & Profile</h3>
                <p id="userAccount">지갑을 연결해주세요.</p>
            </div>
            <div class="card">
                <h3>🚀 Industry Status</h3>
                <p>로봇 자동화: 98% | 우주 탐사: 72% | 핵융합 개발: 85%</p>
            </div>
        </div>
    </div>

    <!-- 챗봇 기능 복구 -->
    <div style="position: fixed; bottom: 30px; right: 30px; font-size: 50px; cursor: pointer;" onclick="toggleChat()">🤖</div>
    <div id="chatModal">
        <h3 style="color: var(--hk-gold);">AGI 비서 삐니</h3>
        <p>무엇을 도와드릴까요?</p>
        <button onclick="toggleChat()" style="background: var(--hk-gold); border: none; padding: 10px; width: 100%; border-radius: 10px; cursor: pointer;">닫기</button>
    </div>

    <script>
        function toggleChat() {
            const m = document.getElementById('chatModal');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }
    </script>
</body>
</html>
