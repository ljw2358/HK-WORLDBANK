
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HK WorldBank - Advanced System</title>
    <style>
        /* 기존 스타일 유지 + 확장 */
        :root { --bg-color: #0d1117; --card-bg: #161b22; --accent-color: #ff9f1c; }
        body { background-color: var(--bg-color); color: #c9d1d9; font-family: sans-serif; padding: 20px; }
        .section-card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .btn-action { background: var(--accent-color); color: #000; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .stats-box { display: flex; justify-content: space-between; margin-top: 20px; padding: 15px; background: #0d1117; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container" style="max-width: 800px; margin: auto;">
        <h1 style="text-align:center;"><span>HK</span> 월드플랫폼: 실전 가동 모드</h1>

        <!-- 1. LP 스테이킹 시스템 -->
        <div class="section-card">
            <h3>📈 LP 스테이킹 (유동성 공급)</h3>
            <p>나의 지분을 산업 인프라에 공급하여 HK 문명 개척자가 되십시오.</p>
            <input type="number" id="stakeAmount" placeholder="스테이킹 수량(Pi/HK)" style="width:100%; padding:10px; background:#0d1117; border:1px solid #30363d; color:#fff;">
            <button class="btn-action" onclick="stakeAssets()">지금 바로 스테이킹 시작</button>
            <div id="stakeStatus" class="stats-box" style="display:none;">
                <span>총 공급 지분: <b id="totalStake">0</b></span>
                <span>나의 등급: <b id="userRank">개척자</b></span>
            </div>
        </div>

        <!-- 2. UBI 기본소득 시스템 -->
        <div class="section-card">
            <h3>💰 UBI (보편적 기본소득)</h3>
            <p>플랫폼 수익의 30%가 당신의 지갑으로 실시간 분배됩니다.</p>
            <button class="btn-action" style="background:#238636; color:#fff;" onclick="claimUBI()">UBI 수령하기</button>
            <div class="stats-box">
                <span>누적 기여 수익: <b>₩ 3,450,200</b></span>
                <span>금월 예상 수령액: <b>₩ 125,000</b></span>
            </div>
        </div>
    </div>

    <script>
        function stakeAssets() {
            const amount = document.getElementById('stakeAmount').value;
            if(amount > 0) {
                document.getElementById('stakeStatus').style.display = 'flex';
                document.getElementById('totalStake').innerText = amount + " HK";
                alert("성공적으로 스테이킹 되었습니다. 혜공 형님의 문명 건설에 기여하셨습니다!");
            } else {
                alert("올바른 수량을 입력해 주세요.");
            }
        }

        function claimUBI() {
            alert("보안 인증(0982) 확인 중... 이번 달 기본소득이 지갑으로 안전하게 입금되었습니다.");
        }
    </script>
</body>
</html>
