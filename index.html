<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HK WORLD BANK</title>
    <style>
        body { background: #0e0e0e; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; }
        h1 { color: #FFD700; text-align: center; margin: 20px 0; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #333; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .icon-box { background: #252525; padding: 15px; border-radius: 15px; text-align: center; cursor: pointer; }
        .btn-full { width: 100%; padding: 15px; border-radius: 15px; border: none; margin-top: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h1>HK WORLD BANK</h1>
    
    <!-- 자산 현황 -->
    <div class="card">
        <h2 style="text-align: center; color: #00e5ff;">400.0817 Pi</h2>
        <div style="border: 2px solid #00ff00; padding: 10px; text-align: center; border-radius: 10px;">Value: $ 125,663,600 (GCV)</div>
    </div>

    <!-- 수익률 정보 -->
    <div class="card grid">
        <div>스테이킹 이율<br><b style="color: #00ff00;">15.71%</b></div>
        <div>LP 수익률<br><b style="color: #00ff00;">31.41%</b></div>
    </div>

    <!-- 9개 서비스 덩어리 -->
    <div class="grid">
        <div class="icon-box">송금</div><div class="icon-box">결재</div><div class="icon-box">예치</div>
        <div class="icon-box">보상</div><div class="icon-box">기본소득</div><div class="icon-box">스왑</div>
        <div class="icon-box">DEX 스왑</div><div class="icon-box">LP 스테이킹</div><div class="icon-box">지갑 연결</div>
    </div>

    <!-- FAQ 및 재단 -->
    <button class="btn-full" style="background: #e91e63;" onclick="toggleChat()">글로벌 AI 자원센터 (FAQ 20)</button>
    <button class="btn-full" style="background: #3f51b5;">HK 사회 재단 비전 2030</button>

    <!-- SNS -->
    <div class="grid" style="margin-top: 20px;">
        <button class="btn-full" style="background: red;">YouTube</button>
        <button class="btn-full" style="background: #000; border: 1px solid #fff;">TikTok</button>
    </div>

    <p style="text-align: center; margin-top: 20px;">support@hkwb.world</p>
</div>

<!-- FAQ 20선 챗봇 모달 -->
<div id="chatModal" style="display:none; position:fixed; bottom:20px; right:20px; width:300px; height:400px; background:#1a1a1a; border:2px solid #FFD700; padding:10px;">
    <h3>FAQ 20선</h3>
    <div id="faqList">1. 스테이킹 방법... (20번까지 배치 예정)</div>
    <button onclick="toggleChat()">닫기</button>
</div>

<script>
    function toggleChat() {
        const m = document.getElementById('chatModal');
        m.style.display = m.style.display === 'none' ? 'block' : 'none';
    }
</script>
</body>
</html>
