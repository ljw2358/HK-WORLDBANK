    <style>
        :root {
            --bg-base: #060913;
            --surface-glass: rgba(18, 24, 38, 0.65);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-active: rgba(212, 175, 55, 0.3);
            --accent-gold: #d4af37;
            --accent-gold-soft: rgba(212, 175, 55, 0.12);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(212, 175, 55, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(30, 58, 138, 0.08) 0%, transparent 50%);
        }

        .matrix-wrapper {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-panel {
            background: var(--surface-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.6);
            transition: var(--transition-smooth);
        }

        .glass-panel:hover {
            border-color: var(--border-active);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-identity {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-emblem {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #d4af37, #996515);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #060913;
            letter-spacing: -0.5px;
            box-shadow: 0 8px 16px rgba(212, 175, 55, 0.2);
        }

        .brand-titles h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .brand-titles p {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 2px;
        }

        .lang-select-wrapper {
            position: relative;
        }

        .lang-dropdown {
            appearance: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 10px 36px 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .lang-dropdown:hover, .lang-dropdown:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent-gold);
        }

        .lang-select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            font-size: 12px;
        }

        .lang-dropdown option {
            background: #0f172a;
            color: var(--text-primary);
            padding: 8px;
        }

        .portfolio-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .portfolio-value {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -1px;
            margin: 8px 0 16px 0;
        }

        .portfolio-value span {
            color: var(--accent-gold);
            font-size: 18px;
            font-weight: 600;
            margin-left: 4px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border-subtle);
        }

        .metric-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .metric-title {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .metric-data {
            font-size: 14px;
            font-weight: 600;
            margin-top: 4px;
            color: var(--text-primary);
        }

        .metric-data.gold {
            color: var(--accent-gold);
        }

        .matrix-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-gold);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.1px;
        }

        .matrix-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent-gold);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-gold);
        }

        .report-stream {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .report-line {
            background: var(--accent-gold-soft);
            border: 1px solid rgba(212, 175, 55, 0.08);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
            transition: var(--transition-smooth);
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .report-line:hover {
            background: rgba(212, 175, 55, 0.08);
            color: var(--text-primary);
            transform: translateX(2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    function switchLanguage(lang) {
        const lines = db[lang] || db['en'];
        const stream = document.getElementById('reportStream');
        stream.innerHTML = '';
        lines.forEach((text, index) => {
            const div = document.createElement('div');
            div.className = 'report-line';
            div.style.animationDelay = `${index * 0.05}s`;
            div.textContent = text;
            stream.appendChild(div);
        });
    }
