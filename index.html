<!DOCTYPE html>
<html lang="ko">
<head>
    <style>
        /* HK 뱅크 플랫폼 디자인 시스템 적용 */
        body { background-color: #0d141e; color: #ffffff; font-family: 'Pretendard', sans-serif; padding: 20px; }
        .card { background: #1a2433; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #2d3a4f; }
        .title { color: #ff9f1c; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; }
        .label { color: #8899a6; font-size: 0.85rem; margin-bottom: 5px; }
        .value { color: #00ffc3; font-size: 1.4rem; font-weight: bold; }
        .btn-main { background: #ff9f1c; color: #000; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. 프로젝트 상태 섹션 -->
    <div class="card">
        <div class="title">영생(Eternal Life) 축가 시스템</div>
        <div class="label">인류의 영원한 염원 | 메인넷 상태</div>
        <div class="value">ACTIVE</div>
        <div class="btn-main" style="margin-top:15px;">영생 프로젝트 즉시 신청하기</div>
    </div>

    <!-- 2. 비전 섹션 -->
    <div class="card">
        <div class="title">HK 비전 2030 (Vision 2030)</div>
        <p style="color: #cbd5e0; font-size: 0.9rem; line-height: 1.6;">
            로보틱스, 핵융합, 우주 인프라 및 AGI를 결합한 인류 영생 표준 플랫폼입니다. 창출된 가치는 전 세계 취약계층의 보편적 기본소득(UBI)으로 환원됩니다.
        </p>
    </div>

    <!-- 3. 핵심 영생 모듈 -->
    <div class="card">
        <div class="label">9대 분산 연동망</div>
        <div class="title">품목별 영생 업무 흐름 제어반</div>
        <div style="padding: 10px 0; border-bottom: 1px solid #2d3a4f;">생체 키 기반 지갑 연결</div>
        <div style="padding: 10px 0; border-bottom: 1px solid #2d3a4f;">디지털 의식 영구 보관</div>
        <div style="padding: 10px 0;">생태계 기여 증명(UBI)</div>
    </div>

</body>
</html>
