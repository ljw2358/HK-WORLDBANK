<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HK WorldBank - Global Banking Engine</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d2a;
      --card-border: #233145;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 8px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .select-wrapper select {
      padding: 8px 12px;
      background-color: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      max-width: 220px;
    }

    .btn {
      padding: 8px 16px;
      background-color: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    .btn-menu {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 1.2rem;
      padding: 6px 12px;
    }

    .status-banner {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .status-banner.verified {
      background-color: rgba(16, 185, 129, 0.1);
      border-color: var(--success);
      color: var(--success);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
    }

    .card-title {
      font-size: 1rem;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    .card-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .action-btn-restricted:disabled {
      background-color: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 28px;
      border-radius: 16px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.5rem;
      cursor: pointer;
    }

    #hkwb-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent);
      color: #000;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      display: none;
      z-index: 9999;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
    }

    html[dir="rtl"] body {
      direction: rtl;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-logo"></div>
        <div class="brand-title" id="brand-title">HK WorldBank</div>
      </div>
      <div class="header-controls">
        <div class="select-wrapper">
          <select id="language-select" onchange="changeLanguage(this.value)"></select>
        </div>
        <button class="btn" id="wallet-btn" onclick="connectWalletAndVerify()">지갑 연결</button>
        <button class="btn btn-menu" onclick="toggleMenuModal()">☰</button>
      </div>
    </header>

    <div class="status-banner" id="status-banner">
      <span id="status-text">⚠️ 현재 [관람 전용(Guest) 모드]입니다. KYC 인증 후 전체 기능을 이용하실 수 있습니다.</span>
      <span id="user-tier-badge">GUEST</span>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <div class="card-title" id="lbl-pi-bal">Pi 보유 수량</div>
        <div class="card-value" id="val-pi-bal">0.00 PI</div>
        <button class="btn action-btn-restricted" id="btn-deposit" disabled onclick="executeDeposit()">지갑 예치</button>
      </div>

      <div class="card">
        <div class="card-title" id="lbl-dex">DEX 토큰 스왑</div>
        <div class="card-value">1 PI = 314.15 USD</div>
        <button class="btn action-btn-restricted" id="btn-swap" disabled onclick="executeDexSwap('PI', 'USDT', 10)">스왑 실행</button>
      </div>

      <div class="card">
        <div class="card-title" id="lbl-staking">LP 스태이킹</div>
        <div class="card-value">APY 31.41%</div>
        <button class="btn action-btn-restricted" id="btn-staking" disabled onclick="depositLpStaking(1, 100)">예치하기</button>
      </div>

      <div class="card">
        <div class="card-title" id="lbl-ubi">HK UBI 기본소득</div>
        <div class="card-value" id="val-ubi">대기 중</div>
        <button class="btn action-btn-restricted" id="btn-ubi" disabled onclick="claimUBI()">기본소득 수령</button>
      </div>
    </div>
  </div>

  <div class="modal" id="menu-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-menu-title">메뉴 & 문서</h3>
        <button class="close-btn" onclick="toggleMenuModal()">×</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button class="btn" style="text-align:left;" id="menu-doc-wp" onclick="showDoc('whitepaper')">📄 백서 (Whitepaper)</button>
        <button class="btn" style="text-align:left;" id="menu-doc-faq" onclick="showDoc('faq')">❓ FAQ (자주 묻는 질문)</button>
        <button class="btn" style="text-align:left;" id="menu-doc-pol" onclick="showDoc('policies')">⚖️ 3대 Policies (규제 & 방침)</button>
        <button class="btn" style="text-align:left;" id="menu-doc-agi" onclick="contactAGI()">🤖 AGI 삐니 고객센터</button>
        <hr style="border-color: var(--card-border); margin: 8px 0;">
        <div style="font-size: 0.85rem; color: var(--text-sub);" id="menu-support">
          공식 이메일 지원: <a href="mailto:support@hkwb.world" style="color: var(--accent);">support@hkwb.world</a>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="doc-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="doc-title">문서 보기</h3>
        <button class="close-btn" onclick="closeDocModal()">×</button>
      </div>
      <div id="doc-body" style="line-height: 1.6; color: var(--text-sub);"></div>
    </div>
  </div>

    let currentUserState = {
      walletAddress: null,
      isKycVerified: false,
      userTier: 'GUEST'
    };

    async function connectWalletAndVerify() {
      showToast("지갑 연결 및 백그라운드 KYC 조회 중...");

      setTimeout(() => {
        currentUserState.walletAddress = "0x71C...89F2";
        currentUserState.isKycVerified = true;
        currentUserState.userTier = 'VERIFIED';

        updateUserUI();
        showToast("KYC 검증 완료! 정식 대시보드가 활성화되었습니다.");
      }, 1200);
    }

    function updateUserUI() {
      const banner = document.getElementById('status-banner');
      const statusText = document.getElementById('status-text');
      const badge = document.getElementById('user-tier-badge');
      const walletBtn = document.getElementById('wallet-btn');

      if (currentUserState.userTier === 'VERIFIED') {
        banner.classList.add('verified');
        statusText.textContent = `✅ KYC/KYB 승인 완료 (${currentUserState.walletAddress}). 모든 연동망 기능이 개방되었습니다.`;
        badge.textContent = "VERIFIED";
        walletBtn.textContent = "연결됨 (0x71C...)";

        document.querySelectorAll('.action-btn-restricted').forEach(btn => {
          btn.disabled = false;
        });

        document.getElementById('val-pi-bal').textContent = "3,141.59 PI";
        document.getElementById('val-ubi').textContent = "수령 가능";
      }
    }

    function executeDexSwap(from, to, amount) {
      if (currentUserState.userTier !== 'VERIFIED') return;
      showToast(`[DEX Contract] ${amount} ${from} -> ${to} 온체인 스왑 실행 중...`);
      setTimeout(() => showToast("스왑 트랜잭션 승인 완료!"), 1500);
    }

    function depositLpStaking(poolId, amount) {
      if (currentUserState.userTier !== 'VERIFIED') return;
      showToast(`[Staking Contract] Pool #${poolId} 에 ${amount} LP 예치 완료!`);
    }

    function claimUBI() {
      if (currentUserState.userTier !== 'VERIFIED') return;
      showToast("HK 사회재단 UBI 스마트 컨트랙트 지급 완료!");
      document.getElementById('val-ubi').textContent = "수령 완료 (금월)";
    }

    function executeDeposit() {
      showToast("현금/카드/타코인 입금 파이프라인으로 이동합니다.");
    }

    function initLanguageSelect() {
      const selectEl = document.getElementById('language-select');
      selectEl.innerHTML = "";
      Object.keys(i18nMap).forEach(code => {
        const option = document.createElement('option');
        option.value = code;
        option.textContent = i18nMap[code].native;
        selectEl.appendChild(option);
      });
    }

    function changeLanguage(selectedCode) {
      const data = i18nMap[selectedCode];
      if (!data) return;

      document.documentElement.dir = data.isRTL ? 'rtl' : 'ltr';
      document.documentElement.lang = selectedCode;

      document.getElementById('lbl-pi-bal').textContent = data.piBal;
      document.getElementById('lbl-dex').textContent = data.dex;
      document.getElementById('lbl-staking').textContent = data.staking;
      document.getElementById('lbl-ubi').textContent = data.ubi;

      document.getElementById('btn-deposit').textContent = data.deposit;
      document.getElementById('btn-swap').textContent = data.swap;
      document.getElementById('btn-staking').textContent = data.stakeBtn;
      document.getElementById('btn-ubi').textContent = data.ubiBtn;
    }

    function toggleMenuModal() {
      const modal = document.getElementById('menu-modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function showDoc(type) {
      toggleMenuModal();
      const docModal = document.getElementById('doc-modal');
      const docTitle = document.getElementById('doc-title');
      const docBody = document.getElementById('doc-body');

      if (type === 'whitepaper') {
        docTitle.textContent = "HK WorldBank 백서 (Whitepaper)";
        docBody.innerHTML = "<p><strong>1. 비전:</strong> 글로벌 기본소득(UBI)과 Web3 디지털 금융 인프라의 결합.</p><p><strong>2. 기술:</strong> Pi Network SDK 및 온체인 DEX 스왑, 자동 KYC 연동.</p>";
      } else if (type === 'faq') {
        docTitle.textContent = "자주 묻는 질문 (FAQ)";
        docBody.innerHTML = "<p><strong>Q: KYC 없이 이용 가능한가요?</strong><br>A: 미인증자는 관람 전용(Guest) 모드로 제한됩니다.</p>";
      } else if (type === 'policies') {
        docTitle.textContent = "3대 Policies (AML, MiCA, 자산보호)";
        docBody.innerHTML = "<p>글로벌 디지털 자산법(MiCA, AML/FATF 트래블룰)을 엄격히 준수합니다.</p>";
      }
      docModal.style.display = 'flex';
    }

    function closeDocModal() {
      document.getElementById('doc-modal').style.display = 'none';
    }

    function contactAGI() {
      toggleMenuModal();
      showToast("AGI 삐니 고객센터 엔진이 연결되었습니다. 질문을 입력하세요.");
    }

    function showToast(msg) {
      const toast = document.getElementById('hkwb-toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initLanguageSelect();
      changeLanguage('ko');
    });
  </script>
