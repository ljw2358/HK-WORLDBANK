<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HK WorldBank Platform</title>
    <style>
        body { background-color: #0f0f0f; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        .logo { font-size: 1.5em; }
        .big-world { font-size: 2em; font-weight: bold; color: #ffd700; }
        #lang-selector { padding: 10px; border-radius: 5px; cursor: pointer; }
        
        /* 3x3 그리드 */
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        
        /* 양파형 비전 섹션 */
        #vision-container { margin: 30px 0; padding: 20px; background: #222; border-radius: 10px; cursor: pointer; }
        #vision-content { display: none; padding: 15px; background: #333; margin-top: 10px; border-radius: 5px; }
        
        #agi-btn { position: fixed; bottom: 30px; right: 30px; padding: 20px; background: #ffd700; color: black; border-radius: 50%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo">HK <span class="big-world">World</span>Bank Platform</div>
    <select id="lang-selector">
        <option>한국어</option>
        <option>English</option>
        <option>日本語</option>
        </select>
</header>

<div id="vision-container" onclick="document.getElementById('vision-content').style.display = (document.getElementById('vision-content').style.display === 'block' ? 'none' : 'block')">
    <h3>🚀 2000 라이프 (Click)</h3>
    <div id="vision-content">
        <h4>HK 비전 2030</h4>
        <p>주거, 의료, 학비 지원 및 1가구 1로봇 보급 프로세스</p>
    </div>
</div>

<main class="grid-container">
    <div class="card"><h3>예치 서비스</h3><input type="number" placeholder="수량"><input type="date"><input type="password" placeholder="비번 6자리" maxlength="6"><button>확인</button></div>
    </main>

<div id="agi-btn">🤖 AGI</div>

<script>
    // 50개국어 및 금융 로직 추가 영역
    console.log("HK WorldBank 플랫폼 가동 시작");
</script>

</body>
</html>
