<!DOCTYPE html>
<html lang="ko">
<head>
    <style>
        /* HK 텔코 플랫폼 디자인 시스템 적용 */
        body { background-color: #0d141e; color: #ffffff; font-family: 'Pretendard', sans-serif; padding: 20px; }
        .card { background: #1a2433; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #2d3a4f; }
        .title { color: #ff9f1c; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; }
        .label { color: #8899a6; font-size: 0.85rem; margin-bottom: 5px; }
        .value { color: #00ffc3; font-size: 1.4rem; font-weight: bold; }
        .btn-main { background: #ff9f1c; color: #000; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div class="title">영생(Eternal Life) 추가 시스템</div>
    <div class="label">인류의 최종 연결 | 마인드 칩셋</div>
    <div class="value">ACTIVE</div>
    <div class="btn-main" style="margin-top:15px;">운영 프로토콜 즉시 신청하기</div>
</div>

<div class="card">
    <div class="title">HK 비전 2030 (Vision 2030)</div>
    <p style="color: #cbd5e0; font-size: 0.9rem; line-height: 1.6;">
        로보틱스, 초연결, 우주 인프라 및 AGI를 결합한 인류 공존 플랫폼입니다. 창출된 가치는 전 세대 전략자원의 기본소득(UBI)으로 환원됩니다.
    </p>
</div>

<div class="card">
    <div class="label">핵심 모듈 정보</div>
    <div class="title">모듈별 담당 업무 정보 요약링크</div>
    <div style="padding: 10px 0; border-bottom: 1px solid #2d3a4f;">설계 및 개발 연결</div>
    <div style="padding: 10px 0; border-bottom: 1px solid #2d3a4f;">디지털 트윈 구축 공유</div>
    <div style="padding: 10px 0;">UBI</div>
</div>

</body>
</html>
