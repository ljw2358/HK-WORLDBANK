<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --hk-gold: #FFD700; --hk-bg: #050505; --hk-card: #1a1a1a; }
        body { background-color: var(--hk-bg); color: #fff; font-family: sans-serif; padding: 20px; }
        .wrapper { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .column { flex: 1; max-width: 500px; }
        .card { background: var(--hk-card); padding: 30px; border-radius: 20px; border: 1px solid #333; margin-bottom: 20px; }
        button { background: var(--hk-gold); color: #000; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: var(--hk-gold);">HK Worldbank</h1>
    <div class="wrapper">
        <div class="column">
            <div class="card">
                <h2>지갑 연결 상태</h2>
                <button id="connectButton" onclick="connectWallet()">지갑 연결하기</button>
                <p id="walletAddress" style="margin-top: 15px;"></p>
            </div>
            <div class="card">
                <h3>HK 사회 재단</h3>
                <p>수익의 30%를 글로벌 사회를 위해 환원합니다.</p>
            </div>
            <div class="card">
                <h3>💎 내 자산 및 프로필</h3>
                <p id="userAccount">지갑을 연결해주세요.</p>
                <p>보유 HK 포인트: 1,250,000 P</p>
            </div>
        </div>
        <div class="column">
            <div class="card">
                <h3>🚀 실시간 산업 현황</h3>
                <p>로봇 자동화: 98%</p>
                <p>우주 탐사: 72%</p>
                <p>핵융합 개발: 85%</p>
            </div>
        </div>
    </div>
    <!-- AGI 챗봇 -->
    <div style="position: fixed; bottom: 30px; right: 30px; font-size: 40px; cursor: pointer;" onclick="alert('혜공 형님의 AGI 비서 삐니입니다!')">🤖</div>
    
    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
    <script>
        async function connectWallet() {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            document.getElementById('walletAddress').innerText = "연결 완료: " + accounts[0].substring(0, 10) + "...";
            document.getElementById('userAccount').innerText = "계정: " + accounts[0];
        }
    </script>
</body>
</html>
