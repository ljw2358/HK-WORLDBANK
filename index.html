<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HK 월드뱅크 - 즉시 가동 엔진</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-10">
    <div id="status" class="bg-amber-500/20 p-4 border border-amber-500 rounded-xl mb-10 font-bold">
        시스템 엔진 가동 완료: 모든 연동망이 즉시 반응합니다.
    </div>
    <div id="grid" class="grid grid-cols-2 md:grid-cols-5 gap-4">
        </div>
    <script>
        const nets = ['지갑연결', '송금', '결제', '예치', '보상', '기본소득', '스왑', 'DEX스왑', 'LP스테이킹', 'PI수량 추가'];
        document.getElementById('grid').innerHTML = nets.map(n => 
            `<button onclick="alert('${n} 구동 완료')" class="p-8 bg-slate-800 border border-slate-700 hover:border-amber-500">${n}</button>`
        ).join('');
        
        // 초동기화 루프 차단: 시스템이 멈추지 않게 즉시 해제
        console.log("엔진 가동: 초동기화 연산 강제 중단 및 직접 구동 모드 활성화");
    </script>
</body>
</html>
