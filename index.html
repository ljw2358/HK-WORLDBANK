<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK WorldBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { text-align: center; background-color: #0f172a; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; }
    </style>
</head>
<body class="p-4 md:p-6 flex flex-col items-center min-h-screen">

    <!-- 상단 타이틀 -->
    <header class="glass p-6 mb-6 w-full max-w-4xl shadow-lg">
        <h1 class="text-2xl font-bold tracking-wider">HK WorldBank</h1>
    </header>

    <main class="w-full max-w-4xl space-y-6">
        
        <!-- 핵심 지표 4가지 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass p-4">
                <span class="text-xs text-gray-400">자산 잔액</span>
                <div class="text-lg font-bold text-blue-400 mt-1">1,000,000.00 ₩</div>
            </div>
            <div class="glass p-4">
                <span class="text-xs text-gray-400">개인 자산 (Pi)</span>
                <div class="text-lg font-bold text-yellow-400 mt-1 flex items-center justify-center space-x-1">
                    <span>π</span><span>31.41 PI</span>
                </div>
            </div>
            <div class="glass p-4">
                <span class="text-xs text-gray-400">UBI 복리 (사회재단)</span>
                <div class="text-lg font-bold text-green-400 mt-1">31.41%</div>
            </div>
            <div class="glass p-4">
                <span class="text-xs text-gray-400">AGI 삐니 상태</span>
                <div class="text-lg font-bold text-emerald-400 mt-1">ONLINE</div>
            </div>
        </div>

        <!-- 빠른 금융 작업 4가지 프로세스 -->
        <div class="glass p-6">
            <h2 class="text-base font-semibold mb-4 text-gray-200">빠른 금융 작업</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <button onclick="runProcess('자금 예치하기')" class="bg-blue-600 hover:bg-blue-500 p-3 rounded-xl text-sm font-medium transition cursor-pointer">자금 예치하기</button>
                <button onclick="runProcess('송금')" class="bg-blue-600 hover:bg-blue-500 p-3 rounded-xl text-sm font-medium transition cursor-pointer">송금</button>
                <button onclick="runProcess('수금')" class="bg-blue-600 hover:bg-blue-500 p-3 rounded-xl text-sm font-medium transition cursor-pointer">수금</button>
                <button onclick="runProcess('송금 팩스')" class="bg-blue-600 hover:bg-blue-500 p-3 rounded-xl text-sm font-medium transition cursor-pointer">송금 팩스</button>
            </div>
        </div>

        <!-- 60개국 분산 연동망 & 9대 미래사업 프로세스 -->
        <div class="glass p-6">
            <h2 class="text-base font-semibold mb-4 text-gray-200">60개국 분산 연동망 & 9대 미래사업</h2>
            <div class="grid grid-cols-3 md:grid-cols-5 gap-3 text-sm">
                <button onclick="runBusiness('로봇')" class="bg-slate-800 hover:bg-slate-700 border border-blue-500/30 p-3 rounded-xl cursor-pointer">로봇</button>
                <button onclick="runBusiness('광영포')" class="bg-slate-800 hover:bg-slate-700 border border-blue-500/30 p-3 rounded-xl cursor-pointer">광영포</button>
                <button onclick="runBusiness('UAM')" class="bg-slate-800 hover:bg-slate-700 border border-blue-500/30 p-3 rounded-xl cursor-pointer">UAM</button>
                <button onclick="runBusiness('핵융합')" class="bg-slate-800 hover:bg-slate-700 border border-blue-500/30 p-3 rounded-xl cursor-pointer">핵융합</button>
                <button onclick="runBusiness('LJW258 인프라')" class="bg-slate-800 hover:bg-slate-700 border border-blue-500/30 p-3 rounded-xl cursor-pointer">LJW258</button>
            </div>
        </div>

        <!-- 삐니 전송 및 질문 오류 해결 센터 -->
        <div class="glass p-6">
            <h2 class="text-base font-semibold mb-3 text-gray-200">삐니에게 무엇이든 물어보세요</h2>
            <div class="flex flex-col space-y-3 max-w-xl mx-auto">
                <input id="piniInput" type="text" placeholder="질문 내용을 입력하세요" class="bg-slate-900 border border-blue-500/40 text-white p-3 rounded-xl text-center text-sm focus:outline-none">
                <button onclick="sendPiniMessage()" class="bg-emerald-600 hover:bg-emerald-500 p-3 rounded-xl text-sm font-bold transition cursor-pointer">전송</button>
            </div>
        </div>

    </main>

    <script>
        function runProcess(name) {
            alert(name + ' 프로세스가 정상 실행되었습니다.');
        }
        function runBusiness(name) {
            alert(name + ' 미래사업 모듈과 연동되었습니다.');
        }
        function sendPiniMessage() {
            const val = document.getElementById('piniInput').value;
            if(!val) {
                alert('전송할 내용을 입력해 주세요.');
                return;
            }
            alert('삐니(Pi-NI) 전송 완료: ' + val);
            document.getElementById('piniInput').value = '';
        }
    </script>
</body>
</html>
