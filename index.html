    <div class="container" style="background-color: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin: 10px 0; color: #333; text-align: center;">
        <h2>HK Worldbank SECURITY</h2>
        <p>지금 바로 <strong>HK 사회 재단</strong>과 함께 미래를 설계하세요!</p>
        <button id="connectButton" onclick="connectWallet()" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">지갑 연결</button>
        <span id="walletAddress" style="margin-left: 10px; font-weight: bold;"></span>
    </div>

    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
    <script>
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    document.getElementById('walletAddress').innerText = "주소: " + accounts[0].substring(0, 10) + "...";
                } catch (error) { alert("연결 실패"); }
            } else { alert("메타마스크를 설치해주세요!"); }
        }
    </script>
    <!-- 다국어 선택 메뉴 -->
    <div style="position: absolute; top: 15px; right: 20px; z-index: 1000;">
        <select id="languageSelect" onchange="changeLanguage()" style="padding: 5px 10px; border-radius: 5px; border: 1px solid #333; cursor: pointer;">
            <option value="ko">한국어</option>
            <option value="en">English</option>
        </select>
    </div>
    <script>
        function changeLanguage() {
            const lang = document.getElementById('languageSelect').value;
            alert(lang + " 언어 모드로 전환합니다.");
        }
    </script>

</body>
    <!-- 언어 선택 메뉴 -->
    <div style="position: absolute; top: 15px; right: 20px; z-index: 9999;">
        <select onchange="alert(this.value + ' 언어로 전환합니다')" style="padding: 8px; border-radius: 5px; cursor: pointer;">
            <option value="한국어">한국어</option>
            <option value="English">English</option>
            <option value="中文">中文</option>
        </select>
    </div>
</html>
