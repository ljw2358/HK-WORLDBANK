<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK WORLD BANK - Global Financial OS</title>
    <style>
        :root {
            --bg-color: #0a0e14;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent: #00ffcc;
            --text-main: #ffffff;
            --text-sub: #b0b0b0;
        }
        body {
            margin: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            border-bottom: 1px solid #333;
        }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: var(--accent); }
        .lang-btn {
            background: var(--card-bg);
            border: 1px solid #555;
            color: white;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .lang-btn:hover { background: rgba(255,255,255,0.1); }
        .main-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            padding: 40px 5%;
            gap: 30px;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .balance-val { font-size: 36px; font-weight: bold; margin: 15px 0; color: var(--accent); }
        .chart-placeholder { height: 250px; background: rgba(0,0,0,0.3); border-radius: 10px; margin-top: 15px; border: 1px dashed #444; }
        
        #langModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); padding: 50px; overflow-y: auto; z-index: 1000;
        }
        .lang-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-top: 20px; }
        .lang-item { padding: 15px; border: 1px solid #333; text-align: center; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .lang-item:hover { background: var(--accent); color: #000; }
    </style>
</head>
<body>

<header>
    <div class="logo">HK WORLD BANK</div>
    <button class="lang-btn" onclick="document.getElementById('langModal').style.display='block'">🌐 Global Language (50)</button>
</header>

<div class="main-container">
    <nav class="card">
        <h3>Menu</h3>
        <p>Dashboard</p>
        <p>Asset Management</p>
        <p>Wire Transfer</p>
        <p>Transaction History</p>
    </nav>
    <main>
        <div class="card">
            <h3>Total Balance</h3>
            <div class="balance-val">₩ 12,450,000</div>
            <div class="chart-placeholder" style="display:flex; justify-content:center; align-items:center; color:#555;">
                Financial Trend Visualization
            </div>
        </div>
    </main>
</div>

<div id="langModal">
    <h2 style="text-align:center">Global Language Settings</h2>
    <div class="lang-grid" id="langGrid"></div>
    <div style="text-align:center; margin-top:30px;">
        <button class="lang-btn" onclick="document.getElementById('langModal').style.display='none'">Close</button>
    </div>
</div>

<script>
    const langs = ["한국어", "English", "日本語", "中文", "Español", "Français", "Deutsch", "Português", "Русский", "العربية", "हिन्दी", "Italiano", "Türkçe", "Nederlands", "Tiếng Việt", "ไทย", "Polski", "Svenska", "Dansk", "Norsk", "Suomi", "Ελληνικά", "Magyar", "Čeština", "Română", "Български", "Українська", "Indonesian", "Malay", "Filipino", "Vietnamese", "Farsi", "Hebrew", "Urdu", "Bengali", "Gujarati", "Marathi", "Punjabi", "Tamil", "Telugu", "Kannada", "Malayalam", "Sinhala", "Khmer", "Lao", "Burmese", "Mongolian", "Kazakh", "Uzbek", "Swahili"];
    const grid = document.getElementById('langGrid');
    langs.forEach(lang => {
        const div = document.createElement('div');
        div.className = 'lang-item';
        div.innerText = lang;
        grid.appendChild(div);
    });
</script>

</body>
</html>
