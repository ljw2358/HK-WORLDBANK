  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161e31;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --accent-yellow: #eab308;
      --accent-blue: #3b82f6;
      --border-color: #2e3b56;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-container {
      width: 100%;
      max-width: 1000px;
    }

    header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 36px;
    }

    .language-selector {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      outline: none;
      min-width: 260px;
    }

    .language-selector option {
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .brand-section {
      text-align: center;
      margin-bottom: 56px;
    }

    .brand-title {
      font-size: 4rem;
      font-weight: 900;
      color: var(--accent-yellow);
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .brand-subtitle {
      font-size: 1.45rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .banking-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 40px;
    }

    .bank-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 240px;
      transition: transform 0.2s;
    }

    .bank-card:hover {
      transform: translateY(-4px);
    }

    .card-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .card-desc {
      font-size: 1rem;
      color: var(--text-sub);
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .action-btn {
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: opacity 0.2s;
      display: inline-block;
    }

    .action-btn:hover {
      opacity: 0.9;
    }

    .btn-yellow {
      background-color: var(--accent-yellow);
      color: #000000;
    }

    .btn-blue {
      background-color: var(--accent-blue);
      color: #ffffff;
    }

    .referral-info {
      text-align: left;
      font-size: 1.05rem;
      color: var(--text-sub);
      border-top: 1px solid var(--border-color);
      padding-top: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
    }

    .referral-info strong {
      color: var(--text-main);
    }

    @media (max-width: 768px) {
      .banking-grid {
        grid-template-columns: 1fr;
      }

      .brand-title {
        font-size: 3rem;
      }
    }
  </style>
</head>

    const selectElement = document.getElementById("language-select");

    LANGUAGES.forEach((lang) => {
      const option = document.createElement("option");
      option.value = lang.code;
      option.textContent = lang.label;
      selectElement.appendChild(option);
    });

    function updateLanguage(langCode) {
      const selectedTranslation = translations[langCode] || translations.en || translations.ko;
      document.documentElement.lang = langCode;
      document.documentElement.dir = RTL_LOCALES.has(langCode) ? "rtl" : "ltr";

      document.querySelectorAll("[data-key]").forEach((element) => {
        const key = element.getAttribute("data-key");
        if (selectedTranslation && selectedTranslation[key]) {
          element.textContent = selectedTranslation[key];
        }
      });

      selectElement.value = langCode;

      try {
        localStorage.setItem("hkwb_lang", langCode);
      } catch (_err) {
        // 저장소 접근 제한 환경 무시
      }
    }

    selectElement.addEventListener("change", (event) => {
      updateLanguage(event.target.value);
    });

    let initialLang = "ko";
    try {
      initialLang = localStorage.getItem("hkwb_lang") || "ko";
    } catch (_err) {
      initialLang = "ko";
    }

    if (!translations[initialLang]) {
      initialLang = "ko";
    }

    updateLanguage(initialLang);
  </script>
