                        <p className="text-xs text-slate-400">{t.passDesc}</p>
                      </div>
                    </div>

                    {/* 24개 그리드 입력 필드 */}
                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2 pt-2">
                      {words.map((w, idx) => (
                        <input
                          key={idx}
                          type="password"
                          placeholder={`word${idx + 1}`}
                          value={w}
                          onChange={(e) => {
                            const newW = [...words];
                            newW[idx] = e.target.value;
                            setWords(newW);
                          }}
                          className="bg-slate-900/90 border border-slate-700/80 rounded px-2 py-1 text-xs text-center focus:border-amber-400 outline-none font-mono"
                        />
                      ))}
                    </div>

                    <div className="flex flex-wrap items-center justify-between gap-2 pt-2">
                      <button
                        onClick={() => setWords(TEST_WORDS_DEFAULT.split(" "))}
                        className="text-xs text-amber-400/80 hover:text-amber-300 underline"
                      >
                        ⚡ 테스트용 구문 자동 채우기
                      </button>

                      <button
                        onClick={() => {
                          setScreen(2);
                          setIsAuthUnlocked(true);
                        }}
                        className="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black px-6 py-2.5 rounded-xl text-sm shadow-lg shadow-amber-500/20"
                      >
                        구문 검증 및 메인 허브 진입 ➔
                      </button>
                    </div>
                  </div>

                  {/* 둘러보기 (Guest Preview) */}
                  <div 
                    onClick={() => setScreen(2)}
                    className="glass-card hover:border-slate-600 transition cursor-pointer p-4 rounded-2xl flex items-center space-x-4 opacity-80 hover:opacity-100"
                  >
                    <div className="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400">
                      👁️
                    </div>
                    <div className="flex-1">
                      <h3 className="font-bold text-sm text-slate-200">{t.guestAuth}</h3>
                      <p className="text-xs text-slate-400">{t.guestDesc}</p>
                    </div>
                    <span className="text-slate-500">➔</span>
                  </div>
                </div>

                <div className="flex justify-between items-center text-xs text-slate-500 pt-4 border-t border-slate-800">
                  <span>발신: HK 그룹 회장 이재완 (혜공)</span>
                  <button 
                    onClick={() => setShowRegisterModal(true)}
                    className="text-blue-400 hover:underline"
                  >
                    ⚙️ 지문 및 비밀구절 등록 절차
                  </button>
                </div>
              </div>
            ) : (
              /* 스크린 2: HK 통합 메인 허브 */
              <div className="space-y-6">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-800">
                  <div>
                    <h2 className="text-2xl font-black text-slate-100 tracking-tight">{t.hubTitle}</h2>
                    <p className="text-xs text-slate-400">{t.hubSub}</p>
                  </div>
                  <div className="flex items-center space-x-2">
                    <span className="text-xs px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center space-x-1">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      <span>10대 분산 연동망 정상 구동 중</span>
                    </span>
                    <button
                      onClick={() => setScreen(1)}
                      className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300"
                    >
                      🚪 게이트웨이로
                    </button>
                  </div>
                </div>

                {/* 5대 핵심 메뉴 탭 버튼 */}
                <div className="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                  {[
                    { id: "dashboard", name: t.menu1, icon: "📊" },
                    { id: "trade", name: t.menu2, icon: "💳" },
                    { id: "bini", name: t.menu3, icon: "🤖" },
                    { id: "nav", name: t.menu4, icon: "🧭" },
                    { id: "media", name: t.menu5, icon: "📺" }
                  ].map((tab) => (
                    <button
                      key={tab.id}
                      onClick={() => handleTabSelect(tab.id)}
                      className={`p-4 rounded-xl text-left border transition flex flex-col justify-between space-y-2 ${
                        activeTab === tab.id
                          ? "bg-blue-600/20 border-blue-500 text-slate-100 shadow-lg shadow-blue-500/10"
                          : "bg-slate-900/60 border-slate-800 text-slate-400 hover:border-slate-700 hover:bg-slate-800/50"
                      }`}
                    >
                      <span className="text-2xl">{tab.icon}</span>
                      <span className="font-bold text-xs leading-tight">{tab.name}</span>
                    </button>
                  ))}
                </div>

                {/* 선택된 메뉴 뷰 */}
                <div className="glass-card p-6 rounded-2xl min-h-[450px]">
                  {activeTab === "dashboard" && (
                    <div className="space-y-6">
                      <h3 className="text-xl font-bold border-b border-slate-800 pb-3 flex items-center justify-between">
                        <span>1. 개인 자산 대시보드</span>
                        <span className="text-xs text-amber-400 font-mono">4중 레이아웃 보안 적용</span>
                      </h3>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="p-4 bg-slate-900/80 rounded-xl border border-slate-800">
                          <p className="text-xs text-slate-400">총 보유 자산 (Total Assets)</p>
                          <p className="text-2xl font-black text-amber-400 mt-1">$128,450,000,000</p>
                          <p className="text-xs text-slate-500 mt-1">₩ 172조 8,500억 원 상당</p>
                        </div>
                        <div className="p-4 bg-slate-900/80 rounded-xl border border-slate-800">
                          <p className="text-xs text-slate-400">PI 코인 보유량 (PI Balance)</p>
                          <p className="text-2xl font-black text-purple-400 mt-1">
                            {testPiBalance.toLocaleString()} <span className="text-xs text-purple-300">TEST PI</span>
                          </p>
                          <p className="text-xs text-emerald-400 mt-1">▲ 메가클러스터 노드 검증 완료</p>
                        </div>
                        <div className="p-4 bg-slate-900/80 rounded-xl border border-slate-800">
                          <p className="text-xs text-slate-400">실시간 누적 이자 (Accrued Yield)</p>
                          <p className="text-2xl font-black text-emerald-400 mt-1 font-mono">
                            +{yieldAmount.toFixed(4)} <span className="text-xs text-emerald-300">PI</span>
                          </p>
                          <p className="text-xs text-slate-500 mt-1">초단위 복리 이자 집계 중...</p>
                        </div>
                      </div>
                    </div>
                  )}

                  {activeTab === "trade" && (
                    <div className="space-y-6">
                      <h3 className="text-xl font-bold border-b border-slate-800 pb-3 flex items-center justify-between">
                        <span>2. 사고 팔고 예금하기 (10대 핵심 프로세스)</span>
                        <span className="text-xs text-blue-400">Test Pi API 시뮬레이터 연동</span>
                      </h3>

                      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                        {[
                          "지갑연결", "송금", "결제", "예치", "보상",
                          "기본소득", "토큰스왑", "DEX 스왑", "LP 스테이킹", "PI 수량관리"
                        ].map((proc, idx) => (
                          <button
                            key={idx}
                            onClick={() => alert(`🚀 [${proc}] 프로세스가 Test Pi 백엔드 노드에서 시범 연동 실행되었습니다.`)}
                            className="p-4 rounded-xl bg-slate-900 hover:bg-blue-600/20 border border-slate-800 hover:border-blue-500/50 transition text-center space-y-2 group"
                          >
                            <div className="text-lg font-mono font-bold text-blue-400 group-hover:scale-110 transition">
                              0{idx + 1}
                            </div>
                            <div className="text-xs font-bold text-slate-200">{proc}</div>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {activeTab === "bini" && (
                    <div className="space-y-4">
                      <h3 className="text-xl font-bold border-b border-slate-800 pb-3 flex items-center justify-between">
                        <span>3. 고객센터 AGI 삐니 (60개국어 지원)</span>
                        <span className="text-xs text-indigo-400">AGI 삐니 실시간 연동 중</span>
                      </h3>

                      <div className="bg-slate-900/90 rounded-xl p-4 h-64 overflow-y-auto space-y-3 border border-slate-800">
                        <div className="flex space-x-3">
                          <div className="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold">삐니</div>
                          <div className="bg-slate-800 p-3 rounded-2xl max-w-lg text-xs space-y-1">
                            <p className="font-bold text-indigo-300">AGI 삐니:</p>
                            <p>안녕하십니까, 혜공 회장님! 60개국어로 뼈속까지 다국어 변환 서비스를 제공하는 AGI 삐니입니다. 구체적인 지시사항을 말씀해 주십시오.</p>
                          </div>
                        </div>
                      </div>

                      <div className="flex space-x-2">
                        <input
                          type="text"
                          placeholder="삐니에게 질문 또는 명령을 입력하세요..."
                          className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-xs focus:border-indigo-500 outline-none"
                        />
                        <button className="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-xs font-bold">
                          전송
                        </button>
                      </div>
                    </div>
                  )}

                  {activeTab === "nav" && (
                    <div className="space-y-6">
                      <h3 className="text-xl font-bold border-b border-slate-800 pb-3">
                        4. 네비게이터 (메뉴보기 & 8대 미래 전략산업)
                      </h3>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="space-y-2 p-4 bg-slate-900/80 rounded-xl border border-slate-800">
                          <h4 className="font-bold text-xs text-amber-400">📜 규제 및 정책 가이드</h4>
                          <ul className="text-xs text-slate-300 space-y-1 list-disc list-inside">
                            <li>백서 100선 및 FAQ 20선</li>
                            <li>3대 핵심 POLICIES</li>
                            <li>FATF 트래블룰 & 실시간 제재 리스트 검증규칙</li>
                            <li>21개국 디지털 자산법 매칭 라이선스</li>
                          </ul>
                        </div>

                        <div className="space-y-2 p-4 bg-slate-900/80 rounded-xl border border-slate-800">
                          <h4 className="font-bold text-xs text-blue-400">🚀 8대 미래 메가클러스터 전략산업</h4>
                          <div className="grid grid-cols-2 gap-2 text-xs text-slate-300">
                            <span>• 로봇 (HK-ROBOT)</span>
                            <span>• 스마트 글래스 (HK-NEXUS)</span>
                            <span>• 도심항공교통 (UAM)</span>
                            <span>• 부품뱅크 (PARTSBANK)</span>
                            <span>• 퀀텀바이오</span>
                            <span>• 인공태양 (핵융합)</span>
                            <span>• 우주산업 (HK-SPACE)</span>
                            <span>• 방위산업</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {activeTab === "media" && (
                    <div className="space-y-4">
                      <h3 className="text-xl font-bold border-b border-slate-800 pb-3 flex items-center justify-between">
                        <span>5. 유튜브와 틱톡 채널 연동</span>
                        <span className="text-xs text-red-400">HK 통합 메인 허브 5번째 방송 센터</span>
                      </h3>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="p-4 bg-slate-900/80 rounded-xl border border-slate-800 space-y-3">
                          <div className="flex items-center space-x-2 text-red-500 font-bold text-sm">
                            <span>▶ YouTube (@Hyekong2026)</span>
                          </div>
                          <div className="aspect-video bg-slate-950 rounded-lg border border-slate-800 flex items-center justify-center text-xs text-slate-500">
                            유튜브 라이브 스트리밍 연동 피드
                          </div>
                        </div>
                        <div className="p-4 bg-slate-900/80 rounded-xl border border-slate-800 space-y-3">
                          <div className="flex items-center space-x-2 text-pink-500 font-bold text-sm">
                            <span>🎵 TikTok (@hyekong2026)</span>
                          </div>
                          <div className="aspect-video bg-slate-950 rounded-lg border border-slate-800 flex items-center justify-center text-xs text-slate-500">
                            틱톡 숏폼 방송 송출 피드
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* 모달 1: 24개 비밀구절 2차 인증 모달 */}
          {showPassModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-card max-w-md w-full p-6 rounded-2xl space-y-4 border-amber-500/40">
                <h3 className="font-bold text-lg text-amber-400 flex items-center space-x-2">
                  <span>🔒</span>
                  <span>{t.authRequiredTitle}</span>
                </h3>
                <p className="text-xs text-slate-300">{t.authRequiredDesc}</p>

                <textarea
                  rows="4"
                  placeholder="24개 단어를 띄어쓰기로 입력하십시오 (예: word1 word2 ...)"
                  value={passphraseInput}
                  onChange={(e) => setPassphraseInput(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-200 outline-none focus:border-amber-400"
                ></textarea>

                <div className="flex justify-between items-center text-xs">
                  <button
                    onClick={() => setPassphraseInput(TEST_WORDS_DEFAULT)}
                    className="text-amber-400 underline"
                  >
                    {t.autoFillBtn}
                  </button>
                  <div className="space-x-2">
                    <button
                      onClick={() => setShowPassModal(false)}
                      className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400"
                    >
                      {t.closeBtn}
                    </button>
                    <button
                      onClick={handleVerifyPassphrase}
                      className="px-4 py-1.5 rounded-lg bg-amber-500 font-bold text-slate-950"
                    >
                      {t.verifyBtn}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 모달 2: 모바일 QR 접속 안내 */}
          {showQRModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-card max-w-sm w-full p-6 rounded-2xl space-y-4 text-center border-blue-500/40">
                <h3 className="font-bold text-lg text-blue-400">{t.qrNotice}</h3>
                <p className="text-xs text-slate-300">{t.qrDesc}</p>
                <div className="w-40 h-40 mx-auto bg-white p-2 rounded-xl flex items-center justify-center text-slate-950 font-bold text-xs">
                  [ 모바일 전용 QR 인증 코드 ]
                </div>
                <button
                  onClick={() => setShowQRModal(false)}
                  className="w-full py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold"
                >
                  {t.closeBtn}
                </button>
              </div>
            </div>
          )}

          {/* 모달 3: 지문 및 24개 구문 등록 */}
          {showRegisterModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-card max-w-lg w-full p-6 rounded-2xl space-y-4 border-emerald-500/40">
                <h3 className="font-bold text-lg text-emerald-400">{t.registerModalTitle}</h3>
                <p className="text-xs text-slate-300">{t.registerModalDesc}</p>
                <div className="p-4 bg-slate-900 rounded-xl text-xs space-y-2 border border-slate-800">
                  <p>1. 모바일 하드웨어 생체 지문 스캔 연동</p>
                  <p>2. 24개 단어 복구 구문 암호화 분산 저장</p>
                  <p>3. 백엔드 REST API 보안 노드 등록 완료</p>
                </div>
                <button
                  onClick={() => {
                    alert("✅ 회장님의 지문과 24개 비밀구절이 백엔드 API 보안 노드에 정상 등록되었습니다.");
                    setShowRegisterModal(false);
                  }}
                  className="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-xs"
                >
                  등록 완료 및 API 연결 테스트
                </button>
              </div>
            </div>
          )}

          {/* 하단 카피라이트 */}
          <footer className="border-t border-slate-800 bg-slate-950 py-4 px-6 text-center text-xs text-slate-500">
            © 2026 HK Group Chairman Lee Jaewan (Hyekong). All Rights Reserved. | Enterprise v10.4
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
