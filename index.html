<div class="min-h-screen bg-slate-950 text-white flex flex-col justify-center items-center px-4 font-sans relative overflow-hidden">
  <!-- Glowing Background Blur Effects -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <main class="text-center z-10 max-w-3xl mx-auto space-y-6">
    <!-- Brand Badge -->
    <span class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold tracking-widest bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase">
      1HK WORLDBANK
    </span>

    <!-- Main Title -->
    <h1 class="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-slate-400">
      The New Paradigm of<br />Digital Finance.
    </h1>

    <!-- Status -->
    <p class="text-2xl sm:text-3xl font-bold tracking-widest text-blue-400 uppercase pt-2">
      Coming Soon
    </p>

    <!-- Vision Statement -->
    <p class="text-slate-400 text-base sm:text-lg max-w-xl mx-auto leading-relaxed pt-2">
      Decentralized banking, global basic income infrastructure, and next-gen asset growth.
    </p>

    <!-- Email Notification Box -->
    <div class="pt-6 flex flex-col sm:flex-row justify-center gap-3 max-w-md mx-auto">
      <input 
        type="email" 
        placeholder="Enter your email" 
        class="px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all w-full"
      />
      <button class="px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-semibold text-white transition-all shadow-lg shadow-blue-600/30 whitespace-nowrap">
        Get Notified
      </button>
    </div>
  </main>
</div>
