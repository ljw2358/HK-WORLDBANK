<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HK WORLD BANK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0c1222; color: #f8fafc; }
        .hk-main-title { font-weight: 900; letter-spacing: -1px; }
        .hk-branch-title { color: #f59e0b; }
    </style>
</head>
<body class="p-8">

    <!-- [주제목] HK WORLD BANK -->
    <header class="mb-12">
        <h1 class="text-6xl font-black text-white hk-main-title">HK WORLD BANK</h1>
        <p class="text-xl text-slate-400 mt-2">국가급 산업 플랫폼 표준</p>

    <!-- [가지: 영생 프로젝트] -->
    <section class="mb-16 p-8 bg-slate-900 rounded-2xl border border-slate-700">
        <h2 class="text-4xl font-bold hk-branch-title mb-4">영생 (Eternal Life) 프로젝트</h2>
        <p class="text-lg text-slate-300">HK WORLD BANK - 2030 비전 실현의 핵심 가지</p>
    </section>

    <!-- [핵심 기능군] -->
    <section class="grid grid-cols-3 gap-6">
        <div class="p-6 bg-slate-800 rounded-xl">금융 컨트롤러</div>
        <div class="p-6 bg-slate-800 rounded-xl">산업: 50개국 거점 클러스터</div>
        <div class="p-6 bg-slate-800 rounded-xl">AGI: 통합 경영 제어</div>
    </section>

    <footer class="mt-16 text-center text-slate-500">
        <p>Hyekong. Chairman & CEO OF HK GROUP</p>
    </footer>

</body>
</html>
