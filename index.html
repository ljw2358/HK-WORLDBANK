<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK WorldBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-900 text-white">

    <!-- 통합된 단일 헤더 -->
    <header class="glass sticky top-0 z-50 px-6 py-4 flex items-center justify-between border-b border-blue-500/20">
        <!-- 로고 -->
        <div class="text-xl font-bold">HK WorldBank</div>
        
        <!-- 우측 유틸리티 영역 -->
        <div class="flex items-center space-x-4">
            <!-- 언어 선택 -->
            <select id="lang-select" class="bg-slate-800 border border-blue-500 text-white rounded-lg px-3 py-1 text-sm">
                <option value="ko">한국어 (Korean)</option>
                <option value="en">English</option>
                <option value="ja">日本語 (Japanese)</option>
                <option value="vi">Tiếng Việt</option>
            </select>
            <!-- 지갑 연결 -->
            <button id="wallet-connect-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-1.5 rounded-lg text-sm shadow transition">
                지갑 연결
            </button>
        </div>
    </header>

    <!-- 대시보드 본문 -->
    <main class="p-6">
        <div class="max-w-4xl mx-auto glass p-8 rounded-2xl">
            <h1 class="text-2xl font-bold mb-4">환영합니다, 고객님</h1>
            <p class="text-gray-400">HK WorldBank에 오신 것을 환영합니다.</p>
        </div>
    </main>

</body>
</html>
