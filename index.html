<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK WorldBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { text-align: center; background-color: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="p-4">
    <header class="glass p-6 rounded-2xl mb-6 max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold">HK WorldBank</h1>
    </header>

    <main class="w-full max-w-4xl mx-auto space-y-6">
        <!-- 핵심 지표 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass p-4 rounded-xl text-sm">자산 잔액<br><span class="text-blue-400 font-bold">1,000,000.00 ₩</span></div>
            <div class="glass p-4 rounded-xl text-sm">개인 자산(Pi)<br><span class="text-yellow-400 font-bold">31.41 PI</span></div>
            <div class="glass p-4 rounded-xl text-sm">UBI 복리(사회재단)<br><span class="text-green-400 font-bold">31.41%</span></div>
            <div class="glass p-4 rounded-xl text-sm">AGI 삐니 상태<br><span class="text-emerald-400 font-bold">ONLINE</span></div>
        </div>

        <!-- 금융 작업 -->
        <div class="glass p-6 rounded-2xl">
            <h2 class="mb-4">빠른 금융 작업</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button class="bg-blue-600 p-3 rounded-lg">자금 예치</button>
                <button class="bg-blue-600 p-3 rounded-lg">송금</button>
                <button class="bg-blue-600 p-3 rounded-lg">수금</button>
                <button class="bg-blue-600 p-3 rounded-lg">송금 팩스</button>
            </div>
        </div>

        <!-- 9대 미래사업 -->
        <div class="glass p-6 rounded-2xl">
            <h2 class="mb-4">60개국 연동망 & 9대 미래사업</h2>
            <div class="grid grid-cols-3 md:grid-cols-5 gap-3 text-sm">
                <button class="bg-slate-700 p-2 rounded">로봇</button>
                <button class="bg-slate-700 p-2 rounded">광영포</button>
                <button class="bg-slate-700 p-2 rounded">UAM</button>
                <button class="bg-slate-700 p-2 rounded">핵융합</button>
                <button class="bg-slate-700 p-2 rounded">LJW258</button>
            </div>
        </div>

        <!-- 삐니 전송 센터 -->
        <div class="glass p-6 rounded-2xl">
            <h2 class="mb-4">삐니 전송 및 질문</h2>
            <div class="flex flex-col gap-3">
                <input type="text" placeholder="삐니에게 무엇이든 물어보세요" class="p-3 rounded-lg text-black text-center">
                <button class="bg-emerald-600 p-3 rounded-lg font-bold">전송</button>
            </div>
        </div>
    </main>
</body>
</html>
