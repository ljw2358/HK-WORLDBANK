<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK-WorldBank - 글로벌 디지털 뱅킹 & 스테이킹 플랫폼</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #07090e;
            --panel-bg: #111622;
            --card-border: #1e2638;
            --accent-gold: #f3ba2f;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --primary-glow: rgba(243, 186, 47, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; line-height: 1.6; }

        .container { max-width: 1200px; margin: 0 auto; }

        /* HK-WORLDBANK 메인 히어로 배너 섹션 */
        .hero-banner {
            background: linear-gradient(135deg, #161f33 0%, #0d121d 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            margin-bottom: 35px;
            box-shadow: 0 10px 30px var(--primary-glow);
            position: relative;
            overflow: hidden;
        }
        .hero-logo { font-size: 3rem; color: var(--accent-gold); margin-bottom: 15px; }
        .hero-title { font-size: 2.5rem; font-weight: 800; color: var(--text-main); margin-bottom: 10px; letter-spacing: -1px; }
        .hero-title span { color: var(--accent-gold); }
        .hero-subtitle { font-size: 1.1rem; color: var(--text-muted); max-width: 800px; margin: 0 auto 20px auto; }
        .hero-badge {
            display: inline-block;
            background: rgba(243, 186, 47, 0.15);
            color: var(--accent-gold);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: bold;
            border: 1px solid rgba(243, 186, 47, 0.4);
        }

        /* 스위치보드 헤더 */
        .switchboard-header { text-align: center; margin-bottom: 30px; }
        .switchboard-header h2 { font-size: 1.8rem; color: var(--accent-gold); margin-bottom: 5px; }
        .switchboard-header p { font-size: 0.95rem; color: var(--text-muted); }

        /* 서비스 그리드 레이아웃 */
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }
        .service-btn {
            background-color: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 22px 18px;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .service-btn:hover {
            border-color: var(--accent-gold);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(243, 186, 47, 0.15);
            background-color: #151d2e;
        }
        .service-number { font-size: 0.75rem; color: var(--accent-gold); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .service-title { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .service-title i { color: var(--accent-gold); font-size: 1.2rem; }

        /* 모달 창 디자인 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-card {
            background: var(--panel-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 20px; right: 20px;
            background: none; border: none;
            color: var(--text-muted); font-size: 1.3rem;
            cursor: pointer;
        }
        .modal-close:hover { color: var(--accent-gold); }
        .modal-title { font-size: 1.3rem; font-weight: 800; color: var(--accent-gold); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        .form-input, .form-select {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 15px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }
        .form-input:focus, .form-select:focus { border-color: var(--accent-gold); }
        
        .calc-result-box {
            background: rgba(243, 186, 47, 0.08);
            border: 1px dashed rgba(243, 186, 47, 0.4);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .calc-row { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 6px; }
        .calc-row:last-child { margin-bottom: 0; font-weight: bold; color: var(--accent-gold); font-size: 1.1rem; border-top: 1px solid rgba(243, 186, 47, 0.2); padding-top: 6px; }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #f3ba2f 0%, #d49f1b 100%);
            color: #000;
            font-weight: 800;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            cursor: pointer;
        }
