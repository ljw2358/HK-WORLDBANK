<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK-WorldBank - 10대 분산 연동망 스위치보드 (혜공 형님)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #07090e;
            --panel-bg: #111623;
            --card-border: #1a2638;
            --accent-gold: #f3ba2f;
            --text-main: #ffffff;
            --text-muted: #8b99ad;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 22px; color: var(--accent-gold); margin-bottom: 5px; font-weight: 800; }
        .header p { font-size: 12px; color: var(--text-muted); }
        
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            max-width: 900px;
            margin: 0 auto 30px auto;
        }
        
        .service-btn {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .service-btn:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }
        .service-btn .num { font-size: 10px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; display: block; }
        .service-btn .title { font-size: 14px; font-weight: 700; color: var(--text-main); }
    </style>
</head>
<body>

    <div class="header">
        <h1>HK-WORLDBANK</h1>
        <p>10대 분산 연동망 통합 스위치보드 (혜공 형님 전용)</p>
    </div>

    <div class="service-grid">
        <div class="service-btn">
            <span class="num">01</span>
            <div class="title">지갑 연동망</div>
        </div>
        <div class="service-btn">
            <span class="num">02</span>
            <div class="title">송금 및 결제</div>
        </div>
        <div class="service-btn">
            <span class="num">03</span>
            <div class="title">자산 예치망</div>
        </div>
        <div class="service-btn">
            <span class="num">04</span>
            <div class="title">UBI 분배망</div>
        </div>
        <div class="service-btn">
            <span class="num">05</span>
            <div class="title">거버넌스 투표</div>
        </div>
        <div class="service-btn">
            <span class="num">06</span>
            <div class="title">노드 밸리데이터</div>
        </div>
        <div class="service-btn">
            <span class="num">07</span>
            <div class="title">브릿지 교환망</div>
        </div>
        <div class="service-btn">
            <span class="num">08</span>
            <div class="title">보안 및 감시망</div>
        </div>
        <div class="service-btn">
            <span class="num">09</span>
            <div class="title">데이터 스토리지</div>
        </div>
        <div class="service-btn">
            <span class="num">10</span>
            <div class="title">Figure AI 연동망</div>
        </div>
    </div>

</body>
</html>
