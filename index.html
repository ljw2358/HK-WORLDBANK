<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HK WorldBank</title>
  
  <!-- PWA & Web App Setup -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* 기본 초기화 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
    }

    /* 부모 컨테이너 레이아웃 */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* 상-중-하 배치 */
      height: 100dvh; /* 모바일 대응 높이 */
      padding: 20px; /* 화면 여백 */
      max-width: 480px; /* 모바일 프레임 고정 */
      margin: 0 auto;
    }

    /* 1. 상단 헤더 & 언어 선택기 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid #30363d;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #58a6ff;
    }

    .lang-select {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    /* 2. 중앙 메인 콘텐츠 영역 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15px;
      padding: 20px 0;
      overflow-y: auto;
    }

    /* 서비스 카드 모듈 */
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
    }

    .card-title {
      font-size: 0.9rem;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 1.6rem;
      font-weight: bold;
      color: #f0f6fc;
    }

    /* 3. 하단 액션 버튼 & 푸터 */
    .footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 15px;
      border-top: 1px solid #30363d;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: #238636;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary:active {
      background: #2ea043;
    }
  </style>
</head>
<body>

  <!-- 전체 화면 부모 컨테이너 -->
  <div class="container">

    <!-- 상단 영역: 브랜딩 및 다국어 선택기 -->
    <header class="header">
      <div class="brand-title">HK WorldBank</div>
      <select class="lang-select" id="langSelector" onchange="changeLanguage(this.value)">
        <option value="ko" selected>한국어 (KR)</option>
        <option value="en">English (EN)</option>
        <option value="zh">中文 (ZH)</option>
      </select>
    </header>

    <!-- 중앙 영역: 주요 대시보드 및 서비스 카드가 들어가는 곳 -->
    <main class="main-content">
      <div class="card">
        <div class="card-title" id="txt-asset-label">총 자산 (Total Balance)</div>
        <div class="card-value" id="txt-asset-val">0.00 Pi</div>
      </div>

      <div class="card">
        <div class="card-title" id="txt-status-label">노드 상태 (Node Status)</div>
        <div class="card-value" style="color: #3fb950; font-size: 1.2rem;" id="txt-status-val">● Active</div>
      </div>
    </main>

    <!-- 하단 영역: 주 기능 실행 버튼 -->
    <footer class="footer">
      <button class="btn-primary" id="btn-action" onclick="handleAction()">
        지갑 연결 (Connect Wallet)
      </button>
    </footer>

  </div>

  <!-- 다국어 변경 및 기본 스크립트 -->
  <script>
    // 서비스 워커 등록 (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed:', err));
      });
    }

    // 언어 데이터
    const i18n = {
      ko: {
        assetLabel: "총 자산",
        statusLabel: "노드 상태",
        actionBtn: "지갑 연결"
      },
      en: {
        assetLabel: "Total Balance",
        statusLabel: "Node Status",
        actionBtn: "Connect Wallet"
      },
      zh: {
        assetLabel: "总资产",
        statusLabel: "节点状态",
        actionBtn: "连接钱包"
      }
    };

    // 언어 전환 함수
    function changeLanguage(lang) {
      const data = i18n[lang];
      if (!data) return;
      document.getElementById('txt-asset-label').innerText = data.assetLabel;
      document.getElementById('txt-status-label').innerText = data.statusLabel;
      document.getElementById('btn-action').innerText = data.actionBtn;
    }

    function handleAction() {
      alert("지갑 연결 프로세스를 시작합니다.");
    }
  </script>
</body>
</html>
