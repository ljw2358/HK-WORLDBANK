<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HK WorldBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-4">
    <!-- 우측 상단 햄버거 -->
    <div class="fixed top-4 right-4 z-50">
        <button id="menuBtn" class="text-4xl text-purple-500">☰</button>
    </div>

    <!-- 메뉴 리스트 (평소엔 숨김) -->
    <div id="sideMenu" class="hidden fixed top-20 right-4 bg-slate-900 border border-purple-700 p-6 rounded-lg w-64 z-40">
        <h3 class="font-bold text-purple-300 mb-2">Legal Compliance</h3>
        <p class="text-sm mb-4">3POLICIES, AML, MiCA</p>
        <h3 class="font-bold text-purple-300 mb-2">Global Network</h3>
        <a href="https://ljw2358.github.io/HK-ROBOT/" target="_blank" class="block py-1 hover:text-purple-400">HK-ROBOT</a>
        <a href="https://ljw2358.github.io/HK-NEXUS/" target="_blank" class="block py-1 hover:text-purple-400">HK-NEXUS</a>
        <a href="https://ljw2358.github.io/HK-UAM/" target="_blank" class="block py-1 hover:text-purple-400">HK-UAM</a>
    </div>

    <!-- 버튼들 (강제 링크 처리) -->
    <div class="grid grid-cols-2 gap-4 mt-20">
        <button onclick="alert('예치 시스템 작동 중')" class="bg-blue-600 p-8 rounded-2xl font-bold">예치하기</button>
        <button onclick="alert('출금 시스템 연결 중')" class="bg-green-600 p-8 rounded-2xl font-bold">출금/송금</button>
    </div>

    <script>
        // 메뉴 토글
        document.getElementById('menuBtn').addEventListener('click', () => {
            document.getElementById('sideMenu').classList.toggle('hidden');
        });
    </script>
</body>
</html>
