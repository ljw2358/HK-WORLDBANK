<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK-MOVIE</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d021a 0%, #1a0b2e 50%, #2d124a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* 우측 상단 드롭다운 및 웹3 로그인 버튼 배치 */
        .top-container {
            width: 100%;
            max-width: 1200px;
            padding: 25px 30px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        .lang-select {
            background-color: #261242;
            color: #00ffcc;
            border: 1px solid #7928ca;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 15px rgba(121, 40, 202, 0.4);
            transition: all 0.3s;
        }
        .lang-select:hover {
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
        }
        .login-btn {
            padding: 8px 16px;
            font-size: 14px;
            background: linear-gradient(135deg, #fe2c55, #25f4ee);
            color: #0d021a;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 15px rgba(37, 244, 238, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            white-space: nowrap;
        }
        .login-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(254, 44, 85, 0.8);
        }
        .hero-container {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .logo {
            font-size: clamp(40px, 8vw, 75px);
            font-weight: 900;
            background: linear-gradient(90deg, #ff0055, #7928ca, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            filter: drop-shadow(0 0 20px rgba(121, 40, 202, 0.8));
        }
        /* 환영 메시지 박스 */
        .welcome-box-container {
            width: 100%;
            max-width: 1100px;
            padding: 0 30px;
            margin: 20px 0 30px 0;
        }
        .welcome-content {
            background-color: rgba(30, 15, 50, 0.8);
            border: 1px solid #7928ca;
            border-radius: 12px;
            padding: 20px 25px;
            font-size: 15px;
            color: #00ffcc;
            line-height: 1.6;
            box-shadow: 0 0 20px rgba(121, 40, 202, 0.2);
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.3);
        }
        main {
            width: 100%;
            max-width: 1200px;
            padding: 0 30px 60px 30px;
        }
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffffff;
            border-left: 4px solid #ff0055;
            padding-left: 12px;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .movie-card {
            background-color: rgba(22, 10, 38, 0.9);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #4a1f8c;
        }
        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
            border-color: #00ffcc;
        }
        .movie-poster {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #120524, #261242);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: #ff0055;
            position: relative;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }
        .movie-info {
            padding: 15px;
        }
        .movie-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
        .movie-genre {
            font-size: 13px;
            color: #ff88ff;
            text-shadow: 0 0 5px rgba(255, 136, 255, 0.3);
        }
        /* 푸터 스타일 */
        footer {
            width: 100%;
            background-color: #080212;
            border-top: 1px solid #33145a;
            padding: 40px 20px;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 15px;
        }
        .footer-links {
            display: flex;
            gap: 25px;
            font-size: 15px;
        }
        .footer-links a {
            color: #25f4ee;
            text-decoration: none;
            transition: color 0.3s, text-shadow 0.3s;
            font-weight: 600;
        }
        .footer-links a:hover {
            color: #fe2c55;
            text-shadow: 0 0 10px rgba(254, 44, 85, 0.8);
        }
        .support-email {
            font-size: 14px;
            color: #9b72cf;
        }
        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(13, 2, 26, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background-color: #1a0b2e;
            border: 1px solid #7928ca;
            border-radius: 12px;
            width: 100%;
            max-width: 850px;
            padding: 30px;
            position: relative;
            box-shadow: 0 0 40px rgba(121, 40, 202, 0.6);
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
        }
        .close-btn:hover {
            color: #00ffcc;
        }
        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 8px;
            margin-top: 15px;
            overflow: hidden;
            border: 1px solid #4a1f8c;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #0d021a;
            border: 1px solid #7928ca;
            border-radius: 6px;
            color: #00ffcc;
            outline: none;
        }
        .login-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #fe2c55, #25f4ee);
            color: #0d021a;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(254, 44, 85, 0.5);
        }
    </style>
</head>
