<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HK WORLD BANK</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1f2430, #11151c);
            border-bottom: 1px solid #30363d;
        }
        header h1 {
            font-size: 2.8rem;
            margin: 0;
            color: #58a6ff;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .quick-fin {
            text-align: center;
            font-size: 1.2rem;
            margin: 20px 0;
            color: #8b949e;
            font-weight: 600;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .nav-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 40px;
        }
        .nav-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .nav-card:hover {
            transform: translateY(-3px);
            border-color: #58a6ff;
        }
        .nav-card h3 {
            margin-top: 0;
            color: #c9d1d9;
        }
        .nav-card a {
            color: #58a6ff;
            text-decoration: none;
            font-weight: 600;
        }
        .nav-card a:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
            color: #8b949e;
            font-size: 0.9rem;
        }
        footer a {
            color: #58a6ff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>HK WORLD BANK</h1>
    </header>

    <div class="quick-fin">
        빠른 금융 작업
    </div>

    <main>
        <div class="nav-container">
            <div class="nav-card">
                <h3>지갑 연동 및 송금</h3>
                <p>PI 네트워크 및 디지털 자산 연동</p>
            </div>
            <div class="nav-card">
                <h3>결제 및 예치</h3>
                <p>스마트 스테이킹 및 UBI 보상 시스템</p>
            </div>
            <div class="nav-card">
                <h3>스왑 및 DEX</h3>
                <p>타 코인 및 현금·카드 연동 구매</p>
            </div>
            <div class="nav-card">
                <h3>계열사 생태계</h3>
                <p>로봇, UAM, 우주, 퓨전 기술 허브</p>
                <a href="https://ljw2358.github.io/HK-ROBOT" target="_blank">HK-ROBOT 이동</a>
            </div>
        </div>
    </main>

    <footer>
        <p>Contact Support: <a href="mailto:support@hkwb.world">support@hkwb.world</a></p>
        <p>&copy; 2026 HK Group. All rights reserved.</p>
    </footer>

</body>
</html>
