        .lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .lang-btn { padding: 20px; border: 1px solid #444; text-align: center; cursor: pointer; border-radius: 10px; }
