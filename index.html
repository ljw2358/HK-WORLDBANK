<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK 월드뱅크 글로벌 플랫폼</title>
    <!-- Tailwind CSS 스타일 빌드 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 아이콘팩 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #080610;
            color: #ffffff; /* 글자 색상을 완전한 흰색으로 올려 시인성 확보 */
            font-family: 'Noto Sans KR', sans-serif;
        }
        /* 전체적인 기본 글자 크기 자체를 크게 고정 */
        html {
            font-size: 18px; 
        }
    </style>
</head>
<body>

    <div class="flex h-screen overflow-hidden">
        
        <!-- [1] 좌측 메인 내비게이션 (글자 및 아이콘 확대) -->
        <aside class="w-80 bg-[#120e24] border-r-2 border-[#362963] flex flex-col justify-between overflow-y-auto">
            <div>
                <!-- 로고 섹션 -->
                <div class="h-28 flex items-center px-6 border-b-2 border-[#362963] bg-[#191333]">
                    <div class="relative mr-4 flex items-center justify-center scale-125">
                        <i class="fa-solid fa-earth-americas text-4xl text-[#3ba3ec] z-10"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-3xl font-black tracking-wider text-[#1ea1f2]">HK</span>
                        <span class="text-lg font-bold text-white tracking-tight">월드뱅크</span>
                    </div>
                </div>
                
                <!-- 한글 금융 메뉴 그룹 (글자 크기 대폭 확대 text-xl) -->
                <nav class="p-4 space-y-2">
                    <div class="text-xs font-bold text-purple-300 px-4 uppercase tracking-wider mb-2">계정 현황</div>
                    <a href="#" class="flex items-center justify-between px-4 py-3.5 bg-purple-500/20 text-white rounded-xl font-bold border-2 border-purple-500/40 text-xl">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-chart-pie text-2xl text-purple-300"></i>
                            <span>종합 대시보드</span>
                        </div>
                    </a>

                    <div class="pt-6 text-xs font-bold text-purple-300 px-4 uppercase tracking-wider mb-2">뱅킹 서비스</div>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-200 hover:bg-[#1f183a] rounded-xl font-bold text-xl transition">
                        <i class="fa-solid fa-paper-plane text-2xl text-purple-400"></i>
                        <span>송금</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-200 hover:bg-[#1f183a] rounded-xl font-bold text-xl transition">
                        <i class="fa-solid fa-credit-card text-2xl text-purple-400"></i>
                        <span>결제</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-200 hover:bg-[#1f183a] rounded-xl font-bold text-xl transition">
                        <i class="fa-solid fa-piggy-bank text-2xl text-purple-400"></i>
                        <span>예치</span>
                    </a>

                    <div class="pt-6 text-xs font-bold text-purple-300 px-4 uppercase tracking-wider mb-2">투자 및 스왑</div>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-200 hover:bg-[#1f183a] rounded-xl font-bold text-xl transition">
                        <i class="fa-solid fa-arrows-rotate text-2xl text-purple-400"></i>
                        <span>스왑</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-200 hover:bg-[#1f183a] rounded-xl font-bold text-xl transition">
                        <i class="fa-solid fa-shuffle text-2xl text-purple-400"></i>
                        <span>DEX스왑</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-200 hover:bg-[#1f183a] rounded-xl font-bold text-xl transition">
                        <i class="fa-solid fa-layer-group text-2xl text-purple-400"></i>
                        <span>LP</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-200 hover:bg-[#1f183a] rounded-xl font-bold text-xl transition">
                        <i class="fa-solid fa-vault text-2xl text-purple-400"></i>
                        <span>스테이킹</span>
                    </a>

                    <div class="pt-6 text-xs font-bold text-purple-300 px-4 uppercase tracking-wider mb-2">재단 운영</div>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-200 hover:bg-[#1f183a] rounded-xl font-bold text-xl transition">
                        <i class="fa-solid fa-gifts text-2xl text-purple-400"></i>
                        <span>보상</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-200 hover:bg-[#1f183a] rounded-xl font-bold text-xl transition">
                        <i class="fa-solid fa-hand-holding-dollar text-2xl text-green-400"></i>
                        <span>기본소득</span>
                    </a>
                </nav>
            </div>
            
            <!-- 하단 의장 프로필 -->
            <div class="p-4 border-t-2 border-[#362963] bg-[#0d0a1a] sticky bottom-0">
                <div class="flex items-center space-x-4 px-2 py-2">
                    <div class="w-12 h-12 bg-gradient-to-tr from-[#1ea1f2] to-[#a1df33] rounded-full flex items-center justify-center font-black text-black text-lg shadow-md">
                        혜공
                    </div>
                    <div>
                        <p class="text-lg font-black text-white tracking-wide">혜공 의장</p>
                        <p class="text-sm text-purple-300 font-bold">최고경영자</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- [2] 우측 메인 대시보드 화면 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            
            <!-- 상단 상태 바 -->
            <header class="h-24 bg-[#120e24] border-b-2 border-[#362963] flex items-center justify-between px-8 z-10">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-3 bg-[#1f183a] px-5 py-2 rounded-full border-2 border-[#362963]">
                        <span class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></span>
                        <span class="text-sm font-bold text-green-400 tracking-wider">파이 메인넷 연동 가동 중</span>
                    </div>
                </div>
                
                <div>
                    <button class="bg-gradient-to-r from-[#1ea1f2] to-[#3ba3ec] text-white font-black px-6 py-3 rounded-xl text-sm tracking-wide shadow-lg">
                        디지털 지갑 연결
                    </button>
                </div>
            </header>

            <!-- [3] 메인 스크롤 영역 -->
            <main class="flex-1 overflow-y-auto p-8 space-y-8">
                
                <!-- 핵심 현황판 카드 (글자 크기 왕창 확대) -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    
                    <!-- 1. 송금 및 결제 -->
                    <div class="bg-[#120e24] border-2 border-[#362963] p-6 rounded-2xl relative">
                        <div class="absolute top-0 left-0 w-full h-[4px] bg-[#1ea1f2]"></div>
                        <p class="text-sm font-black text-gray-300 uppercase">송금 및 결제 지갑</p>
                        <p class="text-3xl font-black mt-3 text-white tracking-wide">1,500,000 원</p>
                    </div>
                    
                    <!-- 2. 예치 및 스테이킹 -->
                    <div class="bg-[#120e24] border-2 border-[#362963] p-6 rounded-2xl relative">
                        <div class="absolute top-0 left-0 w-full h-[4px] bg-[#a1df33]"></div>
                        <p class="text-sm font-black text-gray-300 uppercase">예치 및 스테이킹 총액</p>
                        <p class="text-3xl font-black mt-3 text-[#a1df33] tracking-wide">12,500.00 <span class="text-xl font-bold text-white">π</span></p>
                    </div>
                    
                    <!-- 3. 보상 및 LP (실시간 업카운팅) -->
                    <div class="bg-[#120e24] border-2 border-[#362963] p-6 rounded-2xl relative">
                        <div class="absolute top-0 left-0 w-full h-[4px] bg-purple-500"></div>
                        <p class="text-sm font-black text-gray-300 uppercase">실시간 누적 보상 및 LP</p>
                        <div class="flex items-baseline space-x-1 mt-3">
                            <p id="reward-display" class="text-3xl font-black text-purple-300 tracking-wide">32,450.0000</p>
                            <span class="text-sm font-bold text-white">원</span>
                        </div>
                    </div>
                    
                    <!-- 4. 사회재단 기본소득 -->
                    <div class="bg-[#120e24] border-2 border-[#362963] p-6 rounded-2xl relative">
                        <div class="absolute top-0 left-0 w-full h-[4px] bg-green-500"></div>
                        <p class="text-sm font-black text-gray-300 uppercase">기본소득 분배 적립금</p>
                        <p class="text-3xl font-black mt-3 text-green-400 tracking-wide">4,580,200 원</p>
                    </div>
                </div>

                <!-- 하단 거래 센터 -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    
                    <!-- 스왑 및 DEX스왑 실행 패널 -->
                    <div class="lg:col-span-2 bg-[#120e24] border-2 border-[#362963] p-8 rounded-2xl">
                        <h3 class="text-xl font-black text-white tracking-wide mb-6">실시간 스왑 및 DEX스왑 센터</h3>
                        
                        <!-- 스왑 인풋 UI (글자 크기와 패딩 대폭 증가) -->
                        <div class="space-y-4 bg-[#080610] p-6 rounded-xl border-2 border-[#362963]">
                            <div class="flex justify-between items-center bg-[#191333] p-4 rounded-lg">
                                <input type="number" id="swap-input" class="bg-transparent text-2xl font-black focus:outline-none w-2/3 text-white" value="10">
                                <span class="text-lg font-black text-[#a1df33]"> PI (파이)</span>
                            </div>
                            <div class="flex justify-center">
                                <div class="w-10 h-10 bg-purple-600 rounded-full flex items-center justify-center cursor-pointer border-2 border-white">
                                    <i class="fa-solid fa-arrow-down-up-across-line text-white text-lg"></i>
                                </div>
                            </div>
                            <div class="flex justify-between items-center bg-[#191333] p-4 rounded-lg">
                                <input type="text" id="swap-output" class="bg-transparent text-2xl font-black focus:outline-none w-2/3 text-white" value="450,000" disabled>
                                <span class="text-lg font-black text-[#1ea1f2]"> KRW (원)</span>
                            </div>
                        </div>
                        
                        <button class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-4 rounded-xl text-lg font-black tracking-wide mt-6 shadow-md">
                            즉시 스왑 / DEX 스왑 거래 실행
                        </button>
                    </div>

                    <!-- 최근 금융 거래 내역 -->
                    <div class="bg-[#120e24] border-2 border-[#362963] p-8 rounded-2xl flex flex-col justify-between">
                        <div>
                            <h3 class="text-xl font-black text-white tracking-wide mb-6">최근 금융 거래 내역</h3>
                            <div class="py-14 text-center text-gray-400 space-y-4">
                                <i class="fa-solid fa-receipt text-4xl text-purple-400 mx-auto block"></i>
                                <p class="text-base font-bold">기록된 금융 거래가<br>존재하지 않습니다.</p>
                            </div>
                        </div>
                        <button class="w-full bg-[#1f183a] border-2 border-[#362963] text-white py-3.5 rounded-xl text-sm font-bold transition">
                            전체 내역 상세 조회
                        </button>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- 실시간 수식 엔진 스크립트 -->
    <script>
        let currentReward = 32450.1250;
        setInterval(() => {
            currentReward += Math.random() * 0.015;
            document.getElementById('reward-display').innerText = currentReward.toFixed(4);
        }, 1000);

        const inputEl = document.getElementById('swap-input');
        const outputEl = document.getElementById('swap-output');
        
        inputEl.addEventListener('input', () => {
            const val = parseFloat(inputEl.value) || 0;
            const calculated = val * 45000;
            outputEl.value = calculated.toLocaleString();
        });
    </script>

</body>
</html>
