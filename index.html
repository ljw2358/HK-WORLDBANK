<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK WORLD BANK</title>
    <script type="module">
   import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"; 
        // Firebase 설정
        const firebaseConfig = {
            databaseURL: "https://hkwb-f46f0-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // notice 데이터 실시간 연동
        const noticeRef = ref(db, 'notice');
        onValue(noticeRef, (snapshot) => {
            const data = snapshot.val();
            document.getElementById('notice-text').innerText = data || "공지사항 없음";
        });
    </script>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Arial', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .dashboard { border: 2px solid #333; padding: 20px; border-radius: 15px; margin-bottom: 20px; background: #111; }
        .h1-title { color: #ffeb3b; font-size: 1.8em; margin-bottom: 5px; }
        .balance { font-size: 2em; color: #00f2ff; margin: 15px 0; font-weight: bold; }
        .notice-board { color: #fff; background: #222; padding: 10px; border-radius: 5px; margin-top: 10px; border-left: 5px solid #00f2ff; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .grid-item { background: #1a1a1a; padding: 20px; border-radius: 10px; cursor: pointer; border: 1px solid #333; }
        .grid-item:hover { background: #333; }
        .btn-full { display: block; width: 100%; padding: 15px; margin: 15px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; }
        .btn-ai { background: #7b1fa2; color: #fff; }
        .btn-yt { background: #d32f2f; color: #fff; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1 class="h1-title">HK WORLD BANK</h1>
        <p>통합 자산 관리 시스템</p>
        <div class="balance">400.0673 Pi</div>
        <div class="notice-board" id="notice-text">불러오는 중...</div>
    </div>

    <div class="grid-container">
        <div class="grid-item">송금</div>
        <div class="grid-item">결제</div>
        <div class="grid-item">예치</div>
        <div class="grid-item">보상</div>
        <div class="grid-item">기본소득</div>
        <div class="grid-item">스왑</div>
    </div>

    <button class="btn-full btn-ai">글로벌 AI 지원센터 (FAQ 20)</button>
    <button class="btn-full btn-yt">YouTube 바로가기</button>

</body>
</html>
