<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HK 엔진 테스트</title>
</head>
<body>
    <h1>HK-WorldBank 테스트 페이지</h1>
    <div id="status">엔진 대기 중...</div>

    <script>
        // 엔진 가동 함수
        function startEngine() {
            document.getElementById('status').innerText = "🚀 엔진 가동 성공: 금융 시스템 정상 작동";
            console.log("금융 엔진이 힘차게 돌아갑니다!");
        }

        // 3초 뒤 자동 실행
        setTimeout(startEngine, 3000);
    </script>
</body>
</html>
