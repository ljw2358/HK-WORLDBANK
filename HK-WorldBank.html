<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HK-WorldBank Platform</title>
</head>
<body>
    <h1>HK-WorldBank 금융 엔진 가동 완료!</h1>
    <div id="status">시스템 통합 가동 시작...</div>
    
    <script>
        // 1. 엔진 전역 노출
        window.initKEngine = function() {
            console.log("엔진 가동 완료!");
            document.getElementById('status').innerText = "엔진 가동 완료!";
        };

        // 2. 통합 실행
        window.onload = function() {
            initKEngine();
            setTimeout(function() {
                console.log("시스템 활성화 완료!");
                document.getElementById('status').innerText = "시스템 활성화 완료!";
            }, 500);
        };
    </script>
</body>
</html>
